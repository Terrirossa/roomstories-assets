<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Roomstories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,560;0,9..144,650;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-light:#FCFAF3;
    --ink:#362B22;
    --ink-70:rgba(54,43,34,.72);
    --ink-55:rgba(54,43,34,.55);
    --ink-35:rgba(54,43,34,.35);
    --sage:#77896B;
    --sage-dark:#5C6E55;
    --clay:#BD7B52;
    --gold:#D9A344;
    --line:#E7DDC7;
    --line-strong:#D8CBAC;
    --overlay-dim:rgba(28,21,14,.58);
    --glass-bg:rgba(252,248,238,.40);
    --glass-bg-strong:rgba(252,249,240,.62);
    --glass-border:rgba(255,255,255,.55);
    --shadow-soft:0 1px 2px rgba(54,43,34,.06), 0 6px 18px rgba(54,43,34,.08);
    --shadow-card:0 1px 1px rgba(54,43,34,.05), 0 3px 10px rgba(54,43,34,.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Karla',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#FBF8F0 0%, #F2EBD8 100%);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{ font-family:inherit; }

  .screen{ display:none; width:100%; }
  .screen.active{ display:block; }
  .screen.active.flex{ display:flex; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{
    0%{ transform:scale(.55); opacity:0; }
    65%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes nudgeShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-5px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(3px); }
  }

  /* =========================================================
     shared buttons
  ==========================================================*/
  .btn-primary, .btn-ghost{
    font-size:13.5px;
    font-weight:600;
    border-radius:999px;
    padding:10px 18px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .btn-primary{
    background:var(--sage);
    color:#fff;
    border:1px solid var(--sage);
    box-shadow:0 6px 16px rgba(92,110,85,.35);
  }
  .btn-primary:hover{ background:var(--sage-dark); border-color:var(--sage-dark); }
  .btn-primary.nudge{ animation:nudgeShake .4s ease; }
  .btn-ghost{
    background:var(--paper-light);
    color:var(--ink-70);
    border:1px solid var(--line-strong);
  }
  .btn-ghost:hover{ border-color:var(--sage); color:var(--sage-dark); }
  .btn-on-glass{
    background:rgba(255,255,255,.30);
    color:var(--ink);
    border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .btn-on-glass:hover{ background:rgba(255,255,255,.48); }

  /* =========================================================
     TITLE SCREEN
  ==========================================================*/
  .screen-title{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:24px;
  }
  .title-bg{
    position:absolute;
    inset:-24px;
    background-size:cover;
    background-position:center;
    filter:blur(18px) brightness(.62) saturate(1.05);
    transform:scale(1.06);
  }
  .title-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(40,30,20,.30), rgba(30,22,15,.55));
  }
  .title-card{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:420px;
    background:var(--paper-light);
    border-radius:28px;
    padding:46px 38px 38px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:fadeUp .5s ease;
  }
  .title-mark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:650;
    font-size:42px;
    color:var(--ink);
    margin:0 0 10px;
  }
  .title-tag{
    font-size:14.5px;
    color:var(--ink-55);
    margin:0 0 30px;
    line-height:1.5;
  }
  .title-fresh-link{
    display:block;
    margin:14px auto 0;
    background:none;
    border:none;
    font-size:12.5px;
    color:var(--ink-55);
    text-decoration:underline;
    cursor:pointer;
  }
  .title-fresh-link:hover{ color:var(--ink); }

  /* =========================================================
     ROOM PICKER SCREEN
  ==========================================================*/
  .screen-picker{ min-height:100vh; min-height:100dvh; padding:26px 24px 60px; }
  .picker-header{
    display:flex;
    align-items:center;
    gap:14px;
    max-width:920px;
    margin:0 auto 28px;
  }
  .picker-back{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    color:var(--ink-55); font-size:13.5px; font-weight:600;
    padding:6px 4px;
  }
  .picker-back:hover{ color:var(--ink); }
  .picker-back svg{ width:16px; height:16px; }
  .picker-heading{ max-width:920px; margin:0 auto 22px; }
  .picker-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:560;
    font-size:28px;
    margin:0 0 6px;
  }
  .picker-sub{ font-size:14px; color:var(--ink-55); margin:0; }
  .room-grid{
    max-width:920px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }
  .room-card{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:2.5px solid transparent;
    box-shadow:var(--shadow-card);
    background:var(--paper-light);
    padding:0;
    transition:transform .15s ease, border-color .15s ease;
  }
  .room-card:hover{ transform:translateY(-3px); }
  .room-card.active{ border-color:var(--gold); }
  .room-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .room-card.img-error{ background:var(--paper); }
  .room-card.img-error img{ opacity:0; }
  .room-card.img-error::after{
    content:'Image unavailable';
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 10px;
    font-size:11.5px; color:var(--ink-35);
  }
  .room-card-label{
    position:absolute; left:10px; bottom:10px;
    background:rgba(40,30,20,.55);
    color:#fff;
    font-size:12px; font-weight:600;
    padding:5px 11px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .room-card-check{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .room-card-check svg{ width:12px; height:12px; }
  .room-card-soon{
    width:100%;
    aspect-ratio:16/9;
    border-radius:16px;
    border:1.5px dashed var(--line-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    color:var(--ink-35);
    font-size:12.5px;
    cursor:default;
  }
  .room-card-soon svg{ width:18px; height:18px; opacity:.6; }

  /* =========================================================
     BUILDER SCREEN
  ==========================================================*/
  .screen-builder{
    position:relative;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .rooms-viewport{
    position:absolute;
    inset:0;
    display:flex;
    align-items:stretch;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:thin;
  }
  .stage{
    position:relative;
    flex:0 0 100%;
    height:100%;
    scroll-snap-align:center;
    touch-action:pan-x;
    user-select:none;
    cursor:grab;
  }
  .stage.panning{ cursor:grabbing; }
  .add-room-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:0 6px 16px rgba(20,15,10,.22);
    color:var(--ink-70);
    cursor:pointer;
    z-index:200;
  }
  .add-room-btn:hover{ color:var(--ink); background:var(--paper-light); }
  .add-room-btn svg{ width:15px; height:15px; }
  .add-room-btn-left{ left:14px; }
  .add-room-btn-right{ right:14px; }
  .room-nav-btn{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(10px) saturate(160%);
    -webkit-backdrop-filter:blur(10px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:0 6px 16px rgba(20,15,10,.22);
    color:var(--ink-70);
    cursor:pointer;
    z-index:6000;
  }
  .room-nav-btn:hover{ color:var(--ink); background:var(--paper-light); }
  .room-nav-btn svg{ width:16px; height:16px; }
  .room-nav-left{ left:16px; }
  .room-nav-right{ right:16px; }
  .room-nav-right.tray-open{ right:240px; }
  .stage-bg-layer{
    position:absolute; inset:0;
    z-index:-1000;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1s ease;
    pointer-events:none;
  }
  .stage-bg-layer.active{ opacity:1; }
  .stage.drop-active::after{
    content:'';
    position:absolute; inset:10px;
    border-radius:14px;
    box-shadow:inset 0 0 0 3px var(--sage);
    pointer-events:none;
  }
  .stage-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 30px;
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:20px;
    color:rgba(255,252,244,.85);
    text-shadow:0 2px 14px rgba(0,0,0,.4);
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage-hint.hidden{ opacity:0; }

  /* ambient dust motes — purely decorative, drift slowly through the room */
  .dust-mote{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,210,.95), rgba(255,240,210,0) 72%);
    pointer-events:none;
    z-index:400;
    opacity:0;
    animation-name:motesDrift;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes motesDrift{
    0%   { transform:translate(0,0); opacity:0; }
    12%  { opacity:.82; }
    88%  { opacity:.82; }
    100% { transform:translate(var(--drift-x,18px), var(--drift-y,-160px)); opacity:0; }
  }
  /* at night the same motes become slow-blinking fireflies instead of a
     steady fade — same drift path, no JS changes needed */
  .stage.lamps-lit .dust-mote{
    background:radial-gradient(circle, rgba(214,255,150,.95), rgba(214,255,150,0) 70%);
    animation-name:fireflyDrift;
  }
  @keyframes fireflyDrift{
    0%   { transform:translate(0,0); opacity:0; }
    8%   { opacity:.75; }
    20%  { opacity:.12; }
    32%  { opacity:.8; }
    46%  { opacity:.1; }
    60%  { opacity:.7; }
    74%  { opacity:.15; }
    88%  { opacity:.6; }
    100% { transform:translate(var(--drift-x,18px), var(--drift-y,-160px)); opacity:0; }
  }

  /* a very soft, slow cloud-shadow sweeping the room — deliberately
     imprecise, sits behind the furniture with the background */
  .cloud-shadow{
    position:absolute;
    top:-30%; left:-45%;
    width:95%; height:160%;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(35,30,45,.32), rgba(35,30,45,0) 70%);
    filter:blur(40px);
    pointer-events:none;
    z-index:-500;
    animation:cloudDrift 75s ease-in-out infinite alternate;
  }
  @keyframes cloudDrift{
    0%   { transform:translateX(0); }
    100% { transform:translateX(160%); }
  }

  /* the faintest suggestion of shifting daylight — kept deliberately
     subtle (alpha only ever moves between ~.02 and ~.05) after the plant
     sway feedback; this should be felt more than seen */
  .breathing-light{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:450;
    background:radial-gradient(circle at 50% 35%, rgba(255,250,235,.18), rgba(255,250,235,0) 65%);
    animation:breathe 12s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100% { opacity:.4; }
    50%      { opacity:1; }
  }

  .stage-vignette-top{
    position:absolute; left:0; right:0;
    pointer-events:none;
    z-index:-999;
    top:0; height:130px;
    background:linear-gradient(180deg, rgba(20,15,10,.35), rgba(20,15,10,0));
  }

  /* day/night lighting overlay — sits above the background and every placed
     piece, below all floating UI, so the whole room dims and tints together */
  .night-overlay{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:500;
    opacity:0;
    transition:opacity 1.1s ease, background 1.1s ease;
  }
  .night-overlay.tint-dawn{ opacity:1; background:linear-gradient(200deg, rgba(110,52,54,.34), rgba(168,96,58,.24)); }
  .night-overlay.tint-dusk{ opacity:1; background:linear-gradient(200deg, rgba(90,40,70,.42), rgba(190,100,50,.30)); }
  .night-overlay.tint-night{ opacity:1; background:linear-gradient(200deg, rgba(23,20,52,.55), rgba(41,28,58,.40)); }

  /* a warm wash spreading from each lit lamp, sitting above the dark tint
     with a blend mode so it visually breaks through the darkness rather
     than just getting dimmed by it like everything else */
  .lamp-light-pools{
    position:absolute; inset:0;
    z-index:520;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0;
    transition:opacity .6s ease, background .3s ease;
  }
  .stage.lamps-lit .lamp-light-pools{ opacity:1; }

  /* top bar */
  .builder-topbar{
    position:absolute;
    top:16px; left:16px; right:16px;
    z-index:3000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .builder-brand{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:560;
    font-size:18px;
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .builder-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .time-controls{ display:flex; gap:6px; align-items:center; }
  .time-btn{
    width:36px; height:36px;
    border-radius:50%;
    padding:0;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    background:rgba(255,255,255,.30);
    color:var(--ink);
    border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    cursor:pointer;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .time-btn:hover{ background:rgba(255,255,255,.48); }
  .time-btn.active{ background:var(--ink); color:#fff; box-shadow:0 0 0 2px var(--gold); }

  .arch-picker{ position:relative; }
  #archPickerBtn{
    width:38px; height:38px;
    padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  #archPickerBtn svg{ width:16px; height:16px; }
  .arch-popover{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:14px;
    box-shadow:0 12px 30px rgba(20,15,10,.3);
    padding:10px;
    grid-template-columns:repeat(3, 72px);
    gap:8px;
    z-index:8000;
  }
  .arch-popover.open{ display:grid; }
  .arch-card{
    cursor:pointer;
    border-radius:8px;
    background:none;
    padding:3px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    border:2px solid transparent;
  }
  .arch-card:hover{ background:rgba(255,255,255,.35); }
  .arch-card.active{ border-color:var(--gold); }
  .arch-card img{
    width:72px; height:46px;
    object-fit:cover;
    border-radius:6px;
    display:block;
  }
  .arch-card span{
    font-size:8px;
    font-weight:600;
    color:var(--ink-70);
    text-align:center;
    line-height:1.15;
  }
  .time-btn svg{ width:17px; height:17px; }

  .motion-toggle{
    width:36px; height:36px;
    border-radius:50%;
    padding:0;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .motion-toggle svg{ width:17px; height:17px; }
  .motion-toggle .icon-off{ display:none; }
  .motion-toggle.off .icon-on{ display:none; }
  .motion-toggle.off .icon-off{ display:block; }

  .item-toolbar .bar{ opacity:.3; transition:opacity .15s ease; }
  #swayToolbarBtn[data-level="1"] .bar-1{ opacity:1; }
  #swayToolbarBtn[data-level="2"] .bar-1,
  #swayToolbarBtn[data-level="2"] .bar-2{ opacity:1; }
  #swayToolbarBtn[data-level="3"] .bar{ opacity:1; }
  #lightToolbarBtn[data-level="1"] .bar-1{ opacity:1; }
  #lightToolbarBtn[data-level="2"] .bar-1,
  #lightToolbarBtn[data-level="2"] .bar-2{ opacity:1; }
  #lightToolbarBtn[data-level="3"] .bar{ opacity:1; }

  /* the global switch now only covers room-wide effects — sway is per item */
  .stage.motion-off .lamp-glow{ animation:none !important; }
  .stage.motion-off .dust-mote{ animation:none !important; opacity:0 !important; }
  .stage.motion-off .cloud-shadow{ animation:none !important; opacity:0 !important; }
  .stage.motion-off .breathing-light{ animation:none !important; opacity:0 !important; }

  /* =========================================================
     placed pieces
  ==========================================================*/
  .piece{
    position:absolute;
    top:0; left:0;
    transform-origin:center center;
    will-change:transform, width;
  }
  .piece-inner{ position:relative; width:100%; }
  .lamp-glow{
    position:absolute;
    top:50%; left:50%;
    width:240%; height:240%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,206,130,.85) 0%, rgba(255,196,110,.32) 38%, rgba(255,196,110,0) 72%);
    opacity:.16;
    pointer-events:none;
    transition:opacity 1.1s ease;
  }
  .stage.lamps-lit .lamp-glow{ opacity:calc(.85 * var(--lamp-intensity, 1)); }
  .stage.lamps-lit .piece.lamp-off .lamp-glow{ opacity:.16; }
  @keyframes lampBreathe{ 0%,100%{ opacity:calc(.78 * var(--lamp-intensity, 1)); } 50%{ opacity:calc(.92 * var(--lamp-intensity, 1)); } }
  .stage.lamps-lit .piece:not(.lamp-off) .lamp-glow{ animation:lampBreathe 3.4s ease-in-out infinite; }

  /* plant sway — pivots from the base, like it's rooted in a pot. Amplitude
     and speed come from --sway-amp/--sway-duration, set in JS per strength
     level, so one keyframe rule covers all three. */
  @keyframes plantSway{
    0%   { transform:rotate(calc(var(--sway-amp, 1.6deg) * -1)); }
    50%  { transform:rotate(var(--sway-amp, 1.6deg)); }
    100% { transform:rotate(calc(var(--sway-amp, 1.6deg) * -1)); }
  }
  .piece.sway-eligible .piece-inner{
    transform-origin:50% 100%;
    animation:plantSway var(--sway-duration, 7.5s) ease-in-out infinite;
    animation-delay:var(--sway-delay, 0s);
  }
  /* curtains hang from the rod, so they pivot from the top instead —
     the hem sways, the header stays put */
  .piece.sway-eligible.sway-top .piece-inner{ transform-origin:50% 0%; }
  /* a freshly placed piece holds still for a moment before it starts
     swaying, rather than snapping into motion the instant it lands */
  .piece.settling .piece-inner{ animation:none !important; }
  .piece-inner img{
    position:relative;
    width:100%; height:auto;
    display:block;
    object-fit:contain;
    pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(30,22,14,.30));
    transition:transform .2s ease;
  }
  /* stretchable items (curtains, rods) render as a background-image div
     instead of an <img> — background-size:100% 100% is an unambiguous way
     to force a non-uniform stretch, sidestepping the inconsistent way
     browsers apply object-fit to SVGs specifically loaded via <img> */
  .piece-inner .piece-visual{
    position:relative;
    width:100%; height:100%;
    display:block;
    overflow:hidden;
    pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(30,22,14,.30));
    transition:transform .2s ease;
  }
  .piece.flipped .piece-inner img,
  .piece.flipped .piece-inner .piece-visual{ transform:scaleX(-1); }
  .piece-outline{
    position:absolute; inset:0;
    border-radius:6px;
    box-shadow:0 0 0 1.6px #fff, 0 0 0 3px rgba(20,15,10,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
  }
  .piece.selected .piece-outline{ opacity:1; }

  .handle{
    position:absolute;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--paper-light);
    border:1.5px solid var(--gold);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .piece.selected .handle{ display:flex; }
  .handle-resize{ right:-8px; top:-8px; cursor:nesw-resize; }
  .handle-rotate{ top:-30px; left:50%; transform:translateX(-50%); cursor:grab; }
  .handle-rotate::before{
    content:'';
    position:absolute; top:16px; left:50%;
    width:1px; height:14px;
    background:var(--gold);
    transform:translateX(-50%);
    opacity:.85;
  }
  .handle svg{ width:9px; height:9px; }
  .piece.dragging, .piece.dragging *{ cursor:grabbing !important; }
  .piece-inner.pop{ animation:popIn .32s cubic-bezier(.2,.9,.3,1.2); }

  /* stretch handles are wide grab-strips along most of an edge, not a
     small dot — deliberately a different shape from the round corner
     handle so the two are never confused for one another. Each leaves
     the bottom-right corner clear for the resize handle. */
  .handle-edge{
    position:absolute;
    display:none;
    align-items:center;
    justify-content:center;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--paper-light);
    border:1.5px solid var(--gold);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    color:var(--gold);
  }
  .piece.selected .handle-edge{ display:flex; }
  .handle-edge-h{ right:-8px; top:50%; transform:translateY(-50%); cursor:ew-resize; }
  .handle-edge-v{ bottom:-8px; left:50%; transform:translateX(-50%); cursor:ns-resize; }
  .handle-edge svg{ width:9px; height:9px; }

  /* touch devices get noticeably bigger grab targets on the resize/rotate
     handles — keyed off input precision, not screen size, so a touchscreen
     laptop still gets this and a mouse on a small window doesn't */
  @media (pointer: coarse){
    .handle{ width:26px; height:26px; }
    .handle-resize{ right:-13px; top:-13px; }
    .handle-rotate{ top:-42px; }
    .handle-rotate::before{ top:26px; height:16px; }
    .handle-edge{ width:26px; height:26px; }
    .handle-edge-h{ right:-13px; }
    .handle-edge-v{ bottom:-13px; }
    .handle svg{ width:14px; height:14px; }
    .handle-edge svg{ width:13px; height:13px; }
  }

  /* floating selection toolbar */
  .item-toolbar{
    position:fixed;
    display:none;
    gap:4px;
    background:var(--ink);
    padding:6px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.28);
    z-index:4000;
    transform:translate(-50%,-100%);
  }
  .item-toolbar.visible{ display:flex; }
  .item-toolbar button{
    width:30px; height:30px;
    border:none; background:transparent;
    border-radius:8px;
    color:#F6F1E4;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .12s ease;
  }
  .item-toolbar button:hover{ background:rgba(255,255,255,.14); }
  .item-toolbar button.danger:hover{ background:var(--clay); }
  .item-toolbar svg{ width:16px; height:16px; }
  .item-toolbar .divider{ width:1px; background:rgba(255,255,255,.18); margin:4px 2px; }

  /* =========================================================
     GLASS TRAY (compact, right-side, toggleable)
  ==========================================================*/
  .tray-toggle{
    position:fixed;
    right:18px; bottom:18px;
    width:50px; height:50px;
    border-radius:50%;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:0 10px 26px rgba(20,15,10,.30);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:3100;
    color:var(--ink);
    padding:0;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .tray-toggle:hover{ transform:translateY(-2px); }
  .tray-toggle.open{ background:var(--ink); color:#fff; }
  .tray-toggle svg{ width:19px; height:19px; }
  .tray-toggle .icon-close{ display:none; }
  .tray-toggle.open .icon-open{ display:none; }
  .tray-toggle.open .icon-close{ display:block; }

  .tray-panel{
    position:fixed;
    right:18px; bottom:80px;
    width:210px;
    max-height:min(74vh, 620px);
    z-index:3000;
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:20px;
    box-shadow:0 14px 40px rgba(20,15,10,.32), inset 0 1px 0 rgba(255,255,255,.35);
    padding:10px 10px 10px;
    display:flex;
    flex-direction:column;
    transform-origin:bottom right;
    transition:opacity .16s ease, transform .16s ease;
  }
  .tray-panel.hidden{
    opacity:0;
    transform:scale(.9) translateY(8px);
    pointer-events:none;
  }
  .tray-drag-handle{
    display:flex;
    align-items:center;
    justify-content:center;
    height:16px;
    margin:-2px 0 4px;
    cursor:grab;
    touch-action:none;
    flex-shrink:0;
  }
  .tray-drag-handle span{
    width:30px; height:4px;
    border-radius:2px;
    background:var(--ink-35);
  }
  .tray-drag-handle:hover span{ background:var(--ink-55); }
  .tray-panel.dragging{ transition:none; }
  .tray-panel.dragging .tray-drag-handle{ cursor:grabbing; }
  .tray-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:8px;
  }
  .tab{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-70);
    background:transparent;
    border:none;
    padding:4px 9px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{ background:var(--ink); color:#fff; }
  .tab:not(.active):hover{ background:rgba(54,43,34,.08); }

  .tray-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    overflow-y:auto;
    padding-right:2px;
  }
  .sticker{
    background:var(--glass-bg-strong);
    border:1px solid rgba(255,255,255,.6);
    border-radius:13px;
    padding:7px 5px 6px;
    text-align:center;
    cursor:grab;
    transform:rotate(var(--tilt,0deg));
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
    touch-action:none;
    user-select:none;
  }
  .sticker:hover{
    transform:rotate(0deg) translateY(-2px);
    background:var(--paper-light);
    box-shadow:0 6px 16px rgba(20,15,10,.20);
  }
  .sticker-thumb{
    width:100%; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:4px;
    pointer-events:none;
  }
  .sticker-thumb img{
    max-width:88%; max-height:88%;
    object-fit:contain;
    filter:drop-shadow(0 6px 8px rgba(30,22,14,.20));
  }
  .sticker-label{
    font-size:9px;
    font-weight:600;
    color:var(--ink-70);
    line-height:1.2;
    pointer-events:none;
  }

  /* grouped color variants — one card shown by default, others revealed
     on tap so the tray doesn't need a separate slot per color */
  .sticker-group{ grid-column:1 / -1; }
  .sticker-primary{ position:relative; }
  .variant-dots{
    position:absolute;
    top:5px; right:5px;
    display:flex; gap:2px;
    pointer-events:none;
  }
  .variant-dot{
    width:5px; height:5px;
    border-radius:50%;
    background:var(--ink-35);
  }
  .sticker-group.expanded .sticker-primary{
    box-shadow:0 0 0 1.5px var(--gold);
  }
  .variant-row{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));
    gap:8px;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line-strong);
  }

  /* mute toggle */
  .music-controls{
    position:fixed;
    top:12px; left:50%;
    transform:translateX(-50%);
    z-index:7000;
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(10px) saturate(150%);
    -webkit-backdrop-filter:blur(10px) saturate(150%);
    border:1px solid var(--glass-border);
    border-radius:999px;
    box-shadow:0 3px 8px rgba(20,15,10,.16);
    padding:3px 10px 3px 3px;
    opacity:.82;
    transition:opacity .15s ease;
  }
  .music-controls:hover{ opacity:1; }
  .mute-toggle{
    width:26px; height:26px;
    flex-shrink:0;
    border-radius:50%;
    background:transparent;
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--ink);
    padding:0;
  }
  .mute-toggle:hover{ background:rgba(255,255,255,.35); }
  .mute-toggle svg{ width:12px; height:12px; }
  .mute-toggle .icon-muted{ display:none; }
  .mute-toggle.muted .icon-unmuted{ display:none; }
  .volume-slider{
    width:46px;
    height:3px;
    accent-color:var(--gold);
    cursor:pointer;
  }
  .mute-toggle.muted .icon-muted{ display:block; }

  /* drag ghost */
  .drag-ghost{
    position:fixed; top:0; left:0;
    width:110px;
    pointer-events:none;
    z-index:5000;
    opacity:0;
    display:none;
    transform:translate(-50%,-50%);
  }
  .drag-ghost img{
    width:100%; display:block;
    filter:drop-shadow(0 10px 16px rgba(30,22,14,.35));
  }

  /* =========================================================
     RESULTS OVERLAY
  ==========================================================*/
  .results-overlay{
    position:fixed; inset:0;
    background:var(--overlay-dim);
    z-index:6000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .results-overlay.active{ display:flex; }
  .results-card{
    position:relative;
    background:var(--paper-light);
    border-radius:26px;
    padding:34px 30px 28px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:popIn .32s cubic-bezier(.2,.9,.3,1.15);
  }
  .results-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none;
    font-size:22px; line-height:1;
    color:var(--ink-35);
    cursor:pointer;
  }
  .results-close:hover{ color:var(--ink); }
  .results-eyebrow{ font-size:12.5px; color:var(--ink-55); display:block; margin-bottom:4px; }
  .results-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:25px;
    margin:0 0 12px;
  }
  .results-score{
    font-family:'Fraunces',serif;
    font-weight:650;
    font-size:46px;
    color:var(--sage-dark);
    margin-bottom:20px;
  }
  .results-score span{
    font-size:17px;
    color:var(--ink-35);
    font-family:'Karla',sans-serif;
    font-weight:600;
  }
  .results-bars{ display:flex; flex-direction:column; gap:12px; margin-bottom:24px; text-align:left; }
  .result-bar-row .label-row{
    display:flex; justify-content:space-between;
    font-size:12.5px; font-weight:600; color:var(--ink-70);
    margin-bottom:4px;
  }
  .result-bar-track{ height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
  .result-bar-fill{ height:100%; border-radius:99px; background:var(--sage); transition:width .5s cubic-bezier(.2,.8,.3,1); }
  .results-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<!-- ============================================================
     TITLE SCREEN
============================================================ -->
<section class="screen screen-title active flex" id="screen-title">
  <div class="title-bg"></div>
  <div class="title-scrim"></div>
  <div class="title-card">
    <h1 class="title-mark">Roomstories</h1>
    <p class="title-tag">A cozy little sandbox for styling rooms, one piece at a time.</p>
    <button class="btn-primary" id="titleStartBtn" style="font-size:15px; padding:13px 30px;">Pick a room</button>
    <button class="title-fresh-link" id="titleFreshBtn" style="display:none;">Or start a brand new room</button>
  </div>
</section>

<!-- ============================================================

============================================================ -->

</section>

     BUILDER SCREEN
============================================================ -->

  </button>

  </button>

  <div class="builder-topbar">

        <svg class="icon-off" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c2-3 4-3 6 0s4 3 6 0"/><path d="M4 7c2-3 4-3 6 0s4 3 6 0" opacity=".5"/><path d="M4 4l12 12"/></svg>

      <button class="btn-ghost btn-on-glass" id="clearBtn" type="button">Clear room</button>

    </div>

  <button class="tray-toggle" id="trayToggle" type="button" aria-label="Show or hide items" aria-expanded="true">

    <svg class="icon-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"/></svg>

<!-- floating selection toolbar -->
<div class="item-toolbar" id="itemToolbar">
  <button type="button" data-action="back" title="Send to back" aria-label="Send to back">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="9" height="9" rx="1.5"/><path d="M8 16h8a1 1 0 0 0 1-1V7" stroke-dasharray="2.2 2.2"/></svg>
  </button>
  <button type="button" data-action="step-back" title="Move back one step" aria-label="Move back one step">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>
  </button>
  <button type="button" data-action="step-forward" title="Move forward one step" aria-label="Move forward one step">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5-5 5 5"/></svg>
  </button>
  <button type="button" data-action="front" title="Bring to front" aria-label="Bring to front">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 4h8a1 1 0 0 1 1 1v8" stroke-dasharray="2.2 2.2"/><rect x="4" y="7" width="9" height="9" rx="1.5"/></svg>
  </button>
  <div class="divider"></div>
  <button type="button" data-action="duplicate" title="Duplicate" aria-label="Duplicate">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="9" height="10" rx="1.6"/><path d="M7 7V4.6A1.6 1.6 0 0 1 8.6 3H16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-2.4"/></svg>
  </button>
  <button type="button" data-action="flip" title="Mirror left/right" aria-label="Mirror left/right">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v14" stroke-dasharray="2 2"/><path d="M6 7 3 10l3 3"/><path d="M14 7l3 3-3 3"/></svg>
  </button>
  <button type="button" data-action="view" id="viewToolbarBtn" title="Turn to another side" aria-label="Turn to another side" style="display:none;">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 10.5-4"/><path d="M16 10a6 6 0 0 1-10.5 4"/><path d="M14 3.5v3h-3"/><path d="M6 16.5v-3h3"/></svg>
  </button>
  <button type="button" data-action="sway" id="swayToolbarBtn" title="Toggle swaying" aria-label="Toggle swaying" style="display:none;">
    <svg viewBox="0 0 20 20" fill="none">
      <rect class="bar bar-1" x="3" y="12" width="3" height="5" rx="1" fill="currentColor"/>
      <rect class="bar bar-2" x="8.5" y="8" width="3" height="9" rx="1" fill="currentColor"/>
      <rect class="bar bar-3" x="14" y="4" width="3" height="13" rx="1" fill="currentColor"/>
    </svg>
  </button>
  <button type="button" data-action="light" id="lightToolbarBtn" title="Light intensity" aria-label="Light intensity" style="display:none;">
    <svg viewBox="0 0 20 20" fill="none">
      <rect class="bar bar-1" x="3" y="12" width="3" height="5" rx="1" fill="currentColor"/>
      <rect class="bar bar-2" x="8.5" y="8" width="3" height="9" rx="1" fill="currentColor"/>
      <rect class="bar bar-3" x="14" y="4" width="3" height="13" rx="1" fill="currentColor"/>
    </svg>
  </button>
  <button type="button" data-action="opacity" id="opacityToolbarBtn" title="Transparency" aria-label="Transparency" style="display:none;">
    <span id="opacityBtnLabel" style="font-size:9.5px; font-weight:700; line-height:1;">100</span>
  </button>
  <div class="divider"></div>
  <button type="button" class="danger" data-action="delete" title="Delete" aria-label="Delete">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12"/><path d="M8 6V4.6A1 1 0 0 1 9 3.6h2a1 1 0 0 1 1 1V6"/><path d="M5.5 6 6.3 16a1 1 0 0 0 1 .9h5.4a1 1 0 0 0 1-.9L14.5 6"/></svg>
  </button>
</div>

<div class="drag-ghost" id="dragGhost"><img id="dragGhostImg" alt=""></div>

<audio id="bgMusic" preload="none"></audio>
<div class="music-controls" id="musicControls">

  function applyStretchStyle(el, piece){
    // Only ever touches curtains — anything without an explicit stored
    // height (every normal item, including rods now) must be left
    // completely alone here, or their picture gets frozen at a fixed
    // pixel size instead of following normal resize.
    if (piece.height == null) return;
    // Force exact pixel dimensions on the inner wrapper and the visual
    // element directly, rather than trusting percentage inheritance
    // through several nested position:absolute/relative layers — that
    // chain has proven unreliable in practice, so this removes the
    // ambiguity entirely rather than trying to reason about it further.
    el.style.height = piece.height + '%';
    var rect = el.getBoundingClientRect(); // forces layout with the size just set
    var inner = el.querySelector('.piece-inner');
    if (!inner) return;
    inner.style.width = rect.width + 'px';
    inner.style.height = rect.height + 'px';
    var visual = inner.querySelector('.piece-visual');
    if (visual){
      visual.style.width = rect.width + 'px';
      visual.style.height = rect.height + 'px';
    }

    dawn: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h12"/><path d="M6.5 14a3.5 3.5 0 0 1 7 0"/><path d="M8.3 5.8 10 4l1.7 1.8"/><path d="M10 4v3"/></svg>',
    dusk: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h12"/><path d="M6.5 14a3.5 3.5 0 0 1 7 0"/><path d="M8.3 5.2 10 7l1.7-1.8"/><path d="M10 4v3"/></svg>'
  };

  /* ---------------- state ---------------- */
  var state = {
    activeCategory: 'seating',
    rooms: [
      { id:'room-1', backgroundId: BACKGROUNDS[0].id, architectureId: null }
    ],
    focusedRoomId: 'room-1',
    roomIdCounter: 2,

    selectedUid: null,
    uidCounter: 1,
    trayOpen: true,
    isNight: false,
    activeTime: 'day',
    motionOff: false,
    expandedGroup: null
  };

  function getAsset(id){ for (var i=0;i<ITEMS.length;i++) if (ITEMS[i].id===id) return ITEMS[i]; return null; }
  function getBackground(id){ for (var i=0;i<BACKGROUNDS.length;i++) if (BACKGROUNDS[i].id===id) return BACKGROUNDS[i]; return null; }
  function getPiece(uid){ for (var i=0;i<state.placed.length;i++) if (state.placed[i].uid===uid) return state.placed[i]; return null; }
  function getRoom(id){ for (var i=0;i<state.rooms.length;i++) if (state.rooms[i].id===id) return state.rooms[i]; return null; }
  function architectureFor(room){
    if (!room) return null;
    var bg = getBackground(room.backgroundId);
    if (!bg || !bg.architectures) return null;
    return bg.architectures.filter(function(a){ return a.id === room.architectureId; })[0] || bg.architectures[0];
  }
  function roomStageEl(id){ return document.querySelector('.room-stage[data-room-id="'+id+'"]'); }

  /* ---------------- save / load (localStorage) ----------------
     no backend, so the browser's own storage is the natural fit — this
     is what makes "come back later and find your rooms as you left
     them" actually work, without needing an account or a server. */
  var SAVE_KEY = 'roomstories_save_v1';
  function serializeState(){
    return {
      version: 1,
      rooms: state.rooms,
      placed: state.placed,
      focusedRoomId: state.focusedRoomId,
      roomIdCounter: state.roomIdCounter,
      uidCounter: state.uidCounter,
      activeTime: state.activeTime,
      isNight: state.isNight
    };
  }
  function saveGame(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serializeState())); }
    catch(err){ /* storage full/unavailable — nothing more we can do here */ }
  }
  function loadSavedGame(){
    try{
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || data.version !== 1 || !Array.isArray(data.rooms) || !data.rooms.length) return null;
      return data;
    }catch(err){ return null; }
  }
  function clearSavedGame(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
  }
  function applySavedGame(data){
    state.rooms = data.rooms;
    state.placed = Array.isArray(data.placed) ? data.placed : [];
    state.focusedRoomId = data.focusedRoomId || data.rooms[0].id;
    state.roomIdCounter = data.roomIdCounter || (data.rooms.length + 1);
    state.uidCounter = data.uidCounter || (state.placed.length + 1);
    if (data.activeTime) state.activeTime = data.activeTime;
    if (typeof data.isNight === 'boolean') state.isNight = data.isNight;
  }
  function resetToFreshGame(){
    state.rooms = [{ id:'room-1', backgroundId: BACKGROUNDS[0].id, architectureId: null }];
    state.placed = [];
    state.focusedRoomId = 'room-1';
    state.roomIdCounter = 2;
    state.uidCounter = 1;
    state.selectedUid = null;
    state.isNight = false;
    state.activeTime = 'day';
  }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  /* ---------------- dom refs ---------------- */
  var screens = {
    title: document.getElementById('screen-title'),
    picker: document.getElementById('screen-picker'),
    builder: document.getElementById('screen-builder')
  };
  var roomsViewport = document.getElementById('roomsViewport');
  var roomNavLeft = document.getElementById('roomNavLeft');
  var roomNavRight = document.getElementById('roomNavRight');
  var roomGrid = document.getElementById('roomGrid');
  var trayTabs = document.getElementById('trayTabs');
  var trayGrid = document.getElementById('trayGrid');
  var trayToggle = document.getElementById('trayToggle');
  var trayPanel = document.getElementById('trayPanel');
  var trayDragHandle = document.getElementById('trayDragHandle');
  var timeControls = document.getElementById('timeControls');
  var archPicker = document.getElementById('archPicker');
  var archPickerBtn = document.getElementById('archPickerBtn');

  var dragGhost = document.getElementById('dragGhost');
  var dragGhostImg = document.getElementById('dragGhostImg');

  var muteToggle = document.getElementById('muteToggle');
  var volumeSlider = document.getElementById('volumeSlider');
  var resultsOverlay = document.getElementById('resultsOverlay');
  var resultsBars = document.getElementById('resultsBars');

  // A rotating playlist rather than one looping track — when a track ends,
  // the next one starts, wrapping back to the first after the last.
  var MUSIC_TRACKS = [
    'audio/romantic_calm_piano_for_relaxation.mp3',
    'audio/Wild_Beauty.mp3',
    'audio/Wishful_Piano.mp3'
  ];
  var currentTrack = 0;
  function playCurrentTrack(){
    bgMusic.src = MUSIC_TRACKS[currentTrack];
    bgMusic.play().catch(function(){});
  }
  bgMusic.addEventListener('ended', function(){
    currentTrack = (currentTrack + 1) % MUSIC_TRACKS.length;
    playCurrentTrack();
  });

  /* ---------------- screen navigation ---------------- */
  muteToggle.addEventListener('click', function(){
    bgMusic.muted = !bgMusic.muted;
    muteToggle.classList.toggle('muted', bgMusic.muted);

  function showScreen(name){
    Object.keys(screens).forEach(function(key){
      var isTitle = key === 'title';
      screens[key].classList.toggle('active', key === name);
      if (key === name && isTitle) screens[key].classList.add('flex');
    });
  }

  var hasExistingSave = false;
  document.getElementById('titleStartBtn').addEventListener('click', function(){
    showScreen(hasExistingSave ? 'builder' : 'picker');
    playCurrentTrack();
  });
  document.getElementById('titleFreshBtn').addEventListener('click', function(){
    hasExistingSave = false;
    clearSavedGame();

  });
  changeRoomBtn.addEventListener('click', function(){

  });

  /* ---------------- deterministic tilt for stickers ---------------- */
  function tiltFor(id){
    var h = 0;
    for (var i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) % 1000;
    return ((h/1000)*4.4 - 2.2).toFixed(2);
  }

  /* ---------------- render: room picker ---------------- */
  function bgThumbSrc(bg){
    if (bg.architectures){
      var a0 = bg.architectures[0];
      return a0.times ? a0.times[0].src : a0.src;
    }
    return bg.src;
  }

  /* ---------------- quiet background preloading ----------------
     the room-picker grid, the architecture popover, and the day/night
     buttons all reuse full-size room art as their thumbnails/variants —
     the first time any of them is requested, the browser has to fetch it
     fresh, which is what makes switching or opening a picker feel slow.
     Once the current room is up and interactive, we quietly warm the
     browser's cache with everything else the player is likely to click
     next, so that by the time they do, it's already sitting there. */
  function preloadImage(src){
    var img = new Image();
    img.src = src;
  }
  function runWhenIdle(fn){
    if (typeof requestIdleCallback === 'function') requestIdleCallback(fn, { timeout:2000 });
    else setTimeout(fn, 300);
  }
  function preloadAheadOfNeed(){
    BACKGROUNDS.forEach(function(bg){
      if (bg.architectures){
        bg.architectures.forEach(function(arch){
          if (arch.times) arch.times.forEach(function(t){ preloadImage(t.src); });
          else if (arch.src) preloadImage(arch.src);
        });
      } else if (bg.times){
        bg.times.forEach(function(t){ preloadImage(t.src); });
      } else if (bg.src){
        preloadImage(bg.src);
      }
    });
  }

  function renderRoomGrid(){
    roomGrid.innerHTML = '';
    var focused = getRoom(state.focusedRoomId);
    BACKGROUNDS.forEach(function(bg){
      var isActive = focused && bg.id === focused.backgroundId;
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'room-card' + (isActive ? ' active' : '');
      card.innerHTML =
        '<img src="'+bgThumbSrc(bg)+'" alt="'+bg.name+'" loading="lazy">' +
        '<span class="room-card-label">'+bg.name+'</span>' +
        (isActive ? '<span class="room-card-check"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 8 14l8-8"/></svg></span>' : '');
      card.querySelector('img').addEventListener('error', function(){ card.classList.add('img-error'); });
      card.addEventListener('click', function(){
        var room = getRoom(state.focusedRoomId);
        if (!room) return;
        room.backgroundId = bg.id;
        room.architectureId = bg.architectures ? bg.architectures[0].id : null;
        renderRooms();
        showScreen('builder');
      });
      roomGrid.appendChild(card);
    });
    var soon = document.createElement('div');
    soon.className = 'room-card-soon';
    soon.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg><span>More rooms soon</span>';
    roomGrid.appendChild(soon);
  }
  function currentTimeSrcForRoom(room){
    var bg = getBackground(room.backgroundId);
    var arch = bg.architectures ? architectureFor(room) : bg;
    if (arch.times){
      var t = arch.times.filter(function(t){ return t.id === state.activeTime; })[0] || arch.times[0];
      return t.src;
    }
    return (state.isNight && arch.nightSrc) ? arch.nightSrc : arch.src;
  }
  function applyBackgroundForRoom(room){
    var roomEl = roomStageEl(room.id);
    if (!roomEl) return;
    var src = currentTimeSrcForRoom(room);
    var layers = roomEl.querySelectorAll('.stage-bg-layer');
    var activeLayer = roomEl.querySelector('.stage-bg-layer.active') || layers[0];
    var incoming = activeLayer === layers[0] ? layers[1] : layers[0];
    var img = new Image();
    img.onload = function(){
      incoming.style.backgroundImage = "url('"+src+"')";
      incoming.classList.add('active');
      activeLayer.classList.remove('active');
    };
    img.src = src;
  }
  function updateNightOverlayForRoom(room){
    var roomEl = roomStageEl(room.id);
    if (!roomEl) return;
    var nightOverlayEl = roomEl.querySelector('.night-overlay');
    var bg = getBackground(room.backgroundId);
    var arch = bg.architectures ? architectureFor(room) : bg;
    nightOverlayEl.classList.remove('tint-dawn','tint-dusk','tint-night');
    if (arch.times){
      if (state.activeTime === 'dawn') nightOverlayEl.classList.add('tint-dawn');
      else if (state.activeTime === 'dusk') nightOverlayEl.classList.add('tint-dusk');
      else if (state.activeTime === 'night') nightOverlayEl.classList.add('tint-night');
    } else if (state.isNight){
      nightOverlayEl.classList.add('tint-night');
    }
  }
  function updateLampsLitForRoom(room){
    var roomEl = roomStageEl(room.id);
    if (!roomEl) return;
    var bg = getBackground(room.backgroundId);
    var arch = bg.architectures ? architectureFor(room) : bg;
    var lit = arch.times ? (state.activeTime==='dusk' || state.activeTime==='night') : state.isNight;
    roomEl.classList.toggle('lamps-lit', lit);
  }

  var LAMP_GLOW_RADIUS = 30; // max reach of the effect, in % of stage width
  function updateLampProximityGlow(){
    state.rooms.forEach(function(room){
      var roomEl = roomStageEl(room.id);
      if (!roomEl) return;
      var dark = roomEl.classList.contains('lamps-lit');
      var stageRect = roomEl.getBoundingClientRect();
      var roomPieces = state.placed.filter(function(p){ return p.roomId === room.id; });
      var litLamps = [];
      roomPieces.forEach(function(p){
        var a = getAsset(p.assetId);
        if (a.category === 'lighting' && p.lampOn !== false) litLamps.push(p);
      });

      roomPieces.forEach(function(piece){
        var asset = getAsset(piece.assetId);
        if (asset.category === 'lighting') return; // lamps don't relight themselves
        var el = pieceEl(piece.uid);
        var visual = el ? el.querySelector('.piece-visual') : null;
        if (!visual) return;

        if (!dark || litLamps.length === 0){
          visual.style.filter = '';
          return;
        }

        var best = null, bestDistPx = Infinity;
        litLamps.forEach(function(lamp){
          var dxPx = (lamp.x - piece.x)/100 * stageRect.width;
          var dyPx = (lamp.y - piece.y)/100 * stageRect.height;
          var distPx = Math.hypot(dxPx, dyPx);
          if (distPx < bestDistPx){ bestDistPx = distPx; best = { dx:dxPx, dy:dyPx, lamp:lamp }; }
        });

        var maxPx = LAMP_GLOW_RADIUS/100 * stageRect.width;
        if (!best || bestDistPx > maxPx || bestDistPx === 0){
          visual.style.filter = '';
          return;
        }

        var rimMult = LIGHT_LEVELS[best.lamp.lightIntensity || 2].rim;
        var intensity = (1 - (bestDistPx / maxPx)) * rimMult; // 0..1, stronger when closer or brighter
        var angle = Math.atan2(best.dy, best.dx);
        var ux = Math.cos(angle), uy = Math.sin(angle);

        // correct for this piece's own flip/rotation, since the filter is
        // computed in the piece's local space but we want the glow pointing
        // at the lamp's real position on screen, regardless of orientation
        if (piece.flipped) ux = -ux;
        var rot = -(piece.rotation||0) * Math.PI/180;
        var rux = ux*Math.cos(rot) - uy*Math.sin(rot);
        var ruy = ux*Math.sin(rot) + uy*Math.cos(rot);

        var off1 = 3 + intensity*3, off2 = 6 + intensity*4;
        var blur1 = 12 + intensity*8, blur2 = 22 + intensity*10;
        var alpha1 = (0.16 + intensity*0.30).toFixed(2);
        var alpha2 = (0.09 + intensity*0.18).toFixed(2);

        visual.style.filter =
          'drop-shadow(0 10px 14px rgba(30,22,14,.30)) ' +
          'drop-shadow(' + (rux*off1).toFixed(1) + 'px ' + (ruy*off1).toFixed(1) + 'px ' + blur1.toFixed(0) + 'px rgba(255,200,120,'+alpha1+')) ' +
          'drop-shadow(' + (rux*off2).toFixed(1) + 'px ' + (ruy*off2).toFixed(1) + 'px ' + blur2.toFixed(0) + 'px rgba(255,180,90,'+alpha2+'))';
      });
    });
  }

  function updateLampLightPools(){
    state.rooms.forEach(function(room){
      var roomEl = roomStageEl(room.id);
      if (!roomEl) return;
      var layer = roomEl.querySelector('.lamp-light-pools');
      if (!layer) return;
      var dark = roomEl.classList.contains('lamps-lit');
      var roomPieces = state.placed.filter(function(p){ return p.roomId === room.id; });
      var litLamps = dark ? roomPieces.filter(function(p){
        var a = getAsset(p.assetId);
        return a.category === 'lighting' && p.lampOn !== false;
      }) : [];
      if (!litLamps.length){ layer.style.background = 'none'; return; }
      var stageRect = roomEl.getBoundingClientRect();
      var radiusPx = Math.round(LAMP_GLOW_RADIUS/100 * stageRect.width);
      layer.style.background = litLamps.map(function(lamp){
        var mult = LIGHT_LEVELS[lamp.lightIntensity || 2].pool;
        var alpha = (0.5 * mult).toFixed(2);
        return 'radial-gradient(circle '+radiusPx+'px at '+lamp.x+'% '+lamp.y+'%, rgba(255,190,110,'+alpha+'), rgba(255,190,110,0) 75%)';
      }).join(', ');
    });
  }

  // both effects share the same "who's lit and where" question, so they're
  // always refreshed together
  function updateLampLighting(){
    updateLampProximityGlow();
    updateLampLightPools();
  }

  function refreshRoomVisuals(){
    state.rooms.forEach(function(room){
      var arch = architectureFor(room);
      // a room whose current layout has no time-of-day art doesn't need a
      // fresh image swap on every time change — just its dark/light tint
      if (arch && arch.times) applyBackgroundForRoom(room);
      updateNightOverlayForRoom(room);
      updateLampsLitForRoom(room);
    });
    updateLampLighting();
  }
  function renderTimeControls(){
    var room = getRoom(state.focusedRoomId);
    var bg = room ? getBackground(room.backgroundId) : null;
    var arch = bg ? (bg.architectures ? architectureFor(room) : bg) : null;
    timeControls.innerHTML = '';
    if (!arch) return;
    if (arch.times){
      arch.times.forEach(function(t){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'time-btn' + (state.activeTime===t.id ? ' active' : '');
        btn.title = t.label;
        btn.setAttribute('aria-label', t.label);
        btn.innerHTML = TIME_ICONS[t.icon];
        btn.addEventListener('click', function(){
          if (state.activeTime === t.id) return;
          state.activeTime = t.id;
          refreshRoomVisuals();
          renderTimeControls();
        });
        timeControls.appendChild(btn);
      });
    } else {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'time-btn' + (state.isNight ? ' active' : '');
      btn.title = state.isNight ? 'Switch to day' : 'Switch to night';
      btn.setAttribute('aria-label', btn.title);
      btn.innerHTML = TIME_ICONS[state.isNight ? 'moon' : 'sun'];
      btn.addEventListener('click', function(){
        state.isNight = !state.isNight;
        refreshRoomVisuals();
        renderTimeControls();
      });
      timeControls.appendChild(btn);
    }
  }

  function renderArchPicker(){
    var room = getRoom(state.focusedRoomId);
    var bg = room ? getBackground(room.backgroundId) : null;
    if (!bg || !bg.architectures){
      archPicker.style.display = 'none';
      archPopover.classList.remove('open');
      archPickerBtn.setAttribute('aria-expanded', 'false');
      return;
    }
    var resolvedArch = architectureFor(room);
    // once a room is actually connected to a neighbor on a side, its own
    // layout picker shouldn't offer anything that would drop that door —
    // an unconnected side stays completely free to pick from
    var idx = state.rooms.indexOf(room);
    var connectedLeft = idx > 0;
    var connectedRight = idx !== -1 && idx < state.rooms.length - 1;
    var validOptions = bg.architectures.filter(function(a){
      return (!connectedLeft || a.hasLeftDoor) && (!connectedRight || a.hasRightDoor);
    });
    archPicker.style.display = '';
    archPopover.innerHTML = '';
    validOptions.forEach(function(a){
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'arch-card' + (resolvedArch && resolvedArch.id===a.id ? ' active' : '');
      var thumb = a.times ? a.times[0].src : a.src;
      card.innerHTML = '<img src="'+thumb+'" alt="" loading="lazy"><span>'+a.label+'</span>';
      card.addEventListener('click', function(){
        room.architectureId = a.id;
        renderRooms();
        archPopover.classList.remove('open');
        archPickerBtn.setAttribute('aria-expanded', 'false');
      });
      archPopover.appendChild(card);
    });
  }
  archPickerBtn.addEventListener('click', function(){
    var open = archPopover.classList.toggle('open');

  });
  document.addEventListener('pointerdown', function(e){
    if (archPopover.classList.contains('open') && !archPicker.contains(e.target)){

      archPickerBtn.setAttribute('aria-expanded', 'false');
    }
  });

  /* ---------------- multi-room flat: building & scrolling between rooms ---------------- */
  function buildRoomStageEl(room){
    var el = document.createElement('div');
    el.className = 'stage room-stage' + (state.motionOff ? ' motion-off' : '');
    el.dataset.roomId = room.id;
    el.innerHTML =
      '<div class="stage-bg-layer active"></div>' +
      '<div class="stage-bg-layer"></div>' +
      '<div class="cloud-shadow"></div>' +
      '<div class="stage-vignette-top"></div>' +
      '<div class="breathing-light"></div>' +
      '<div class="night-overlay"></div>' +
      '<div class="lamp-light-pools"></div>' +
      '<p class="stage-hint">Drag a piece onto the room to start decorating</p>';
    return el;
  }

  var addRoomPopoverEl = null;
  function closeAddRoomPopover(){
    if (addRoomPopoverEl){ addRoomPopoverEl.remove(); addRoomPopoverEl = null; }
    document.removeEventListener('pointerdown', onDocPointerDownCloseAddRoom);
  }
  function onDocPointerDownCloseAddRoom(e){
    if (addRoomPopoverEl && !addRoomPopoverEl.contains(e.target)) closeAddRoomPopover();
  }
  function openAddRoomPopover(anchorBtn, side, options, onPick){
    closeAddRoomPopover();
    var pop = document.createElement('div');
    pop.className = 'arch-popover open';
    pop.style.position = 'fixed';
    if (!options.length){
      pop.innerHTML = '<span style="font-size:11px;font-weight:600;color:var(--ink-70);max-width:150px;display:block;">No matching layouts yet</span>';
    }
    options.forEach(function(a){
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'arch-card';
      var thumb = a.times ? a.times[0].src : a.src;
      card.innerHTML = '<img src="'+thumb+'" alt="" loading="lazy"><span>'+a.label+'</span>';
      card.addEventListener('click', function(e){
        e.stopPropagation();
        closeAddRoomPopover();
        onPick(a);
      });
      pop.appendChild(card);
    });
    document.body.appendChild(pop);
    var rect = anchorBtn.getBoundingClientRect();
    pop.style.top = Math.max(70, window.innerHeight/2 - 100) + 'px';
    if (side === 'left'){
      // the button sits at the left edge, so open toward the room (rightward)
      pop.style.left = (rect.right + 8) + 'px';
      pop.style.right = 'auto';
    } else {
      // the button sits at the right edge, so open toward the room (leftward)
      pop.style.right = (window.innerWidth - rect.left + 8) + 'px';
      pop.style.left = 'auto';
    }

  var roomScrollAnimId = 0;
  function animateRoomsScrollTo(targetLeft, duration){
    var myId = ++roomScrollAnimId;
    var startLeft = roomsViewport.scrollLeft;
    var delta = targetLeft - startLeft;
    if (Math.abs(delta) < 1) return;
    // scroll-snap briefly fighting a JS-driven scrollLeft for the final
    // pixel or two is what made this feel worse, not better — turning it
    // off for the duration of our own animation and restoring it once
    // we've landed exactly on the target avoids that tug-of-war
    roomsViewport.style.scrollSnapType = 'none';
    var startTime = null;
    function step(timestamp){
      if (myId !== roomScrollAnimId) return; // superseded by a newer transition
      if (startTime === null) startTime = timestamp;
      var t = Math.min(1, (timestamp - startTime) / duration);
      // ease-in-out-cubic — a gentle glide in and a soft landing, rather
      // than the curt, near-linear snap of the browser's own smooth-scroll
      var eased = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
      roomsViewport.scrollLeft = startLeft + delta*eased;

  // felt "too intense" as a blanket default.

  function canSway(asset){

  // separate concept from the freehand angle-rotate handle — it swaps in a

    // two different curtains/rods sharing a name would collide and one's
    // colors would silently override the other's. Every asset gets a
    // unique prefix on its classes and ids before it's ever shown.
    var classNames = {};

      var escaped = oldId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    el.style.left = piece.x + '%';
    el.style.top = piece.y + '%';
    el.style.width = piece.width + '%';
    el.style.zIndex = piece.z;
    el.style.transform = 'translate(-50%,-50%) rotate('+piece.rotation+'deg)';

    var extraHandles = '';
    if (stretchMode === 'both' || stretchMode === 'horizontal'){
      extraHandles += '<div class="handle-edge handle-edge-h" data-handle="stretch-h"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 3 8l3 4"/><path d="M10 4l3 4-3 4"/></svg></div>';
    }
    if (stretchMode === 'both'){
      extraHandles += '<div class="handle-edge handle-edge-v" data-handle="stretch-v"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6 8 3l4 3"/><path d="M4 10l4 3 4-3"/></svg></div>';
    }
    // rods and curtains stretch to fit a window — free rotation doesn't
    // curtains and rods never get a rotation handle — a window dressing
    // doesn't get rotated at an angle, in this game at least
    var rotateHandle = asset.category === 'curtains' ? '' :
      '<div class="handle handle-rotate" data-handle="rotate"><svg viewBox="0 0 20 20" fill="none" stroke="#BD7B52" stroke-width="1.6" stroke-linecap="round"><path d="M6 6a5 5 0 1 1-1 3"/><path d="M5 4v3h3"/></svg></div>';

    var visualHtml = isStretchable
      ? '<div class="piece-visual" style="opacity:'+((piece.transparency||100)/100)+'"></div>'
      : '<img class="piece-visual" src="'+viewSrcFor(piece, asset)+'" alt="'+asset.name+'" style="opacity:'+((piece.transparency||100)/100)+'">';

    el.innerHTML =
      '<div class="piece-inner'+(animate?' pop':'')+'">' +
        (asset.category==='lighting' ? '<div class="lamp-glow"></div>' : '') +
        visualHtml +
        '<div class="piece-outline"></div>' +
        rotateHandle +
        '<div class="handle handle-resize" data-handle="resize"></div>' +
        extraHandles +
      '</div>';

    var pieceRoomEl = roomStageEl(piece.roomId);
    if (pieceRoomEl) pieceRoomEl.appendChild(el);
    applyStretchStyle(el, piece);
    if (isStretchable){
      var visualEl = el.querySelector('.piece-visual');
      if (visualEl) loadStretchableSvg(viewSrcFor(piece, asset), visualEl);
    }

    var innerEl = el.querySelector('.piece-inner');
    if (animate) setTimeout(function(){ innerEl.classList.remove('pop'); }, 340);
    if (animate && el.classList.contains('sway-eligible')){
      el.classList.add('settling');
      setTimeout(function(){ el.classList.remove('settling'); }, 1500);
    }

    el.addEventListener('pointerdown', function(e){ onPieceDown(e, piece.uid, el); });
    el.querySelector('[data-handle="resize"]').addEventListener('pointerdown', function(e){ e.stopPropagation(); startResize(e, piece.uid, el); });
    var rotateEl = el.querySelector('[data-handle="rotate"]');
    if (rotateEl) rotateEl.addEventListener('pointerdown', function(e){ e.stopPropagation(); startRotate(e, piece.uid, el); });
    var stretchH = el.querySelector('[data-handle="stretch-h"]');
    if (stretchH) stretchH.addEventListener('pointerdown', function(e){ e.stopPropagation(); startStretch(e, piece.uid, el, 'h'); });
    var stretchV = el.querySelector('[data-handle="stretch-v"]');
    if (stretchV) stretchV.addEventListener('pointerdown', function(e){ e.stopPropagation(); startStretch(e, piece.uid, el, 'v'); });
  }

  function fullRerenderPieces(){
    Array.prototype.slice.call(document.querySelectorAll('.piece')).forEach(function(n){ n.remove(); });
    state.placed.slice().sort(function(a,b){ return a.z-b.z; }).forEach(function(p){ renderPiece(p,false); });
    if (state.selectedUid) applySelectionClass();
    updateAllHints();
    updateLampLighting();
  }

  function pieceEl(uid){ return document.querySelector('.piece[data-uid="'+uid+'"]'); }

  // Stacking order is simply the order of state.placed — index 0 is the
  // very back, the last entry is the very front. z-index is always
  // reassigned as a clean 1..N range from that order, so it can never
  // drift into extreme values the way an ever-incrementing/decrementing
  // counter could (which is what let a piece end up sent so far back it
  // sank below other stage layers and became unclickable).
  function reassignZIndices(){
    state.rooms.forEach(function(room){
      var i = 0;
      state.placed.forEach(function(p){
        if (p.roomId !== room.id) return;
        i++;
        p.z = i;
        var el = pieceEl(p.uid);
        if (el) el.style.zIndex = p.z;
      });
    });
  }
  function bringToFront(piece){
    var idx = state.placed.indexOf(piece);
    if (idx === -1 || idx === state.placed.length - 1) return;
    state.placed.splice(idx, 1);
    state.placed.push(piece);
    reassignZIndices();
  }
  function sendToBack(piece){
    var idx = state.placed.indexOf(piece);
    if (idx <= 0) return;
    state.placed.splice(idx, 1);
    state.placed.unshift(piece);
    reassignZIndices();
  }
  function roomPiecesOrdered(roomId){
    return state.placed.filter(function(p){ return p.roomId === roomId; });
  }
  function moveStepForward(piece){
    var roomPieces = roomPiecesOrdered(piece.roomId);
    var idx = roomPieces.indexOf(piece);
    if (idx === -1 || idx === roomPieces.length - 1) return;
    var next = roomPieces[idx + 1];
    var realIdxA = state.placed.indexOf(piece);
    var realIdxB = state.placed.indexOf(next);
    state.placed[realIdxA] = next;
    state.placed[realIdxB] = piece;
    reassignZIndices();
  }
  function moveStepBackward(piece){
    var roomPieces = roomPiecesOrdered(piece.roomId);
    var idx = roomPieces.indexOf(piece);
    if (idx <= 0) return;
    var prev = roomPieces[idx - 1];
    var realIdxA = state.placed.indexOf(piece);
    var realIdxB = state.placed.indexOf(prev);
    state.placed[realIdxA] = prev;
    state.placed[realIdxB] = piece;
    reassignZIndices();
  }

  function applySelectionClass(){
    Array.prototype.slice.call(document.querySelectorAll('.piece')).forEach(function(n){
      n.classList.toggle('selected', n.dataset.uid === state.selectedUid);
    });
  }

  function updateViewButtonUI(){
