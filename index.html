  function selectPiece(uid){
    state.selectedUid = uid; applySelectionClass(); positionToolbar(); updateSwayButtonUI(); updateOpacityButtonUI(); updateLightButtonUI(); updateViewButtonUI();
  }
  function deselect(){
    state.selectedUid = null; applySelectionClass(); itemToolbar.classList.remove('visible');
  }
  function updateAllHints(){
    state.rooms.forEach(function(room){
      var roomEl = roomStageEl(room.id);
      if (!roomEl) return;
      var hint = roomEl.querySelector('.stage-hint');
      if (!hint) return;
      var count = state.placed.filter(function(p){ return p.roomId === room.id; }).length;
      hint.classList.toggle('hidden', count > 0);
    });
  }

  /* ---------------- moving a placed piece ---------------- */
  var moveDrag = null;
  function onPieceDown(e, uid, el){
    if (e.target.closest('[data-handle]')) return;
    e.preventDefault();
    selectPiece(uid);
    var piece = getPiece(uid);
    var rect = roomStageEl(piece.roomId).getBoundingClientRect();
    moveDrag = { pointerId:e.pointerId, uid:uid, el:el, rect:rect, startX:e.clientX, startY:e.clientY, startPctX:piece.x, startPctY:piece.y, moved:false };
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    el.addEventListener('pointermove', onMoveMove);
    el.addEventListener('pointerup', onMoveEnd);
    el.addEventListener('pointercancel', onMoveEnd);
  }
  function onMoveMove(e){
    if (!moveDrag || e.pointerId!==moveDrag.pointerId) return;
    if (Math.abs(e.clientX-moveDrag.startX) > 4 || Math.abs(e.clientY-moveDrag.startY) > 4) moveDrag.moved = true;
    var piece = getPiece(moveDrag.uid);
    var dxPct = (e.clientX - moveDrag.startX) / moveDrag.rect.width * 100;
    var dyPct = (e.clientY - moveDrag.startY) / moveDrag.rect.height * 100;
    piece.x = clamp(moveDrag.startPctX + dxPct, 0, 100);
    piece.y = clamp(moveDrag.startPctY + dyPct, 0, 100);
    moveDrag.el.style.left = piece.x + '%';
    moveDrag.el.style.top = piece.y + '%';
    updateLampLighting();
    positionToolbar();
  }
  function onMoveEnd(e){
    if (!moveDrag || e.pointerId!==moveDrag.pointerId) return;
    if (!moveDrag.moved){
      var piece = getPiece(moveDrag.uid);
      var asset = getAsset(piece.assetId);
      if (asset.category === 'lighting'){
        piece.lampOn = !piece.lampOn;
        moveDrag.el.classList.toggle('lamp-off', !piece.lampOn);
        updateLampLighting();
      } else if (asset.toggleSrc){
        toggleItemState(piece, asset, moveDrag.el);
      }
    }
    moveDrag.el.classList.remove('dragging');
    moveDrag.el.removeEventListener('pointermove', onMoveMove);
    moveDrag.el.removeEventListener('pointerup', onMoveEnd);
    moveDrag.el.removeEventListener('pointercancel', onMoveEnd);
    moveDrag = null;
  }

  /* ---------------- resizing ---------------- */
  var resizeDrag = null;
  function startResize(e, uid, el){
    e.preventDefault();
    selectPiece(uid);
    var piece = getPiece(uid);
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    var startDist = Math.hypot(e.clientX-cx, e.clientY-cy);
    resizeDrag = { pointerId:e.pointerId, uid:uid, el:el, cx:cx, cy:cy, startDist:startDist, startWidth:piece.width, startHeight:piece.height };
    var handle = e.target.closest('.handle');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    handle.addEventListener('pointermove', onResizeMove);
    handle.addEventListener('pointerup', onResizeEnd);
    handle.addEventListener('pointercancel', onResizeEnd);
  }
  function onResizeMove(e){
    if (!resizeDrag || e.pointerId!==resizeDrag.pointerId) return;
    var piece = getPiece(resizeDrag.uid);
    var dist = Math.hypot(e.clientX-resizeDrag.cx, e.clientY-resizeDrag.cy);
    var scale = dist / Math.max(resizeDrag.startDist, 1);
    piece.width = clamp(resizeDrag.startWidth * scale, MIN_WIDTH, MAX_WIDTH);
    resizeDrag.el.style.width = piece.width + '%';
    // once a piece has an independent height (stretched at some point),
    // the corner handle scales both dimensions together proportionally
    // instead of letting the natural image ratio take back over
    if (resizeDrag.startHeight != null){
      piece.height = clamp(resizeDrag.startHeight * scale, 2, 90);
      applyStretchStyle(resizeDrag.el, piece);
    }
    updateSwayEligibility(resizeDrag.el, piece, getAsset(piece.assetId));
    positionToolbar();
  }
  function onResizeEnd(e){
    if (!resizeDrag || e.pointerId!==resizeDrag.pointerId) return;
    var handle = resizeDrag.el.querySelector('[data-handle="resize"]');
    handle.removeEventListener('pointermove', onResizeMove);
    handle.removeEventListener('pointerup', onResizeEnd);
    handle.removeEventListener('pointercancel', onResizeEnd);
    resizeDrag = null;
  }

  /* ---------------- independent horizontal/vertical stretch ---------------- */
  var stretchDrag = null;
  function upgradeToStretchableVisual(el, piece, asset){
    // this item never declared its own art proportions, so it's been
    // rendering as a plain <img> at its natural size up to now. The first
    // time someone actually grabs a stretch handle, measure whatever
    // height it's currently sitting at and lock that in as its starting
    // point, then swap to the same inline-SVG technique curtains use —
    // a plain <img> won't reliably distort, only an SVG's own
    // preserveAspectRatio attribute does that consistently.
    if (piece.height != null) return;
    var stageEl = roomStageEl(piece.roomId);
    if (!stageEl) return;
    var rect = el.getBoundingClientRect();
    var stageRect = stageEl.getBoundingClientRect();
    if (!stageRect.height) return;
    piece.height = clamp(rect.height / stageRect.height * 100, 2, 90);
    var oldVisual = el.querySelector('.piece-visual');
    if (oldVisual && oldVisual.tagName === 'IMG'){
      var newVisual = document.createElement('div');
      newVisual.className = 'piece-visual';
      newVisual.style.opacity = oldVisual.style.opacity;
      oldVisual.replaceWith(newVisual);
      applyStretchStyle(el, piece);
      loadStretchableSvg(viewSrcFor(piece, asset), newVisual);
    } else {
      applyStretchStyle(el, piece);
    }
  }
  function startStretch(e, uid, el, mode){
    e.preventDefault();
    selectPiece(uid);
    var piece = getPiece(uid);
    var asset = getAsset(piece.assetId);
    upgradeToStretchableVisual(el, piece, asset);
    var stageRect = roomStageEl(piece.roomId).getBoundingClientRect();
    stretchDrag = {
      mode:mode, pointerId:e.pointerId, uid:uid, el:el, stageRect:stageRect,
      startX:e.clientX, startY:e.clientY,
      startWidth:piece.width, startHeight:piece.height,
      startPieceX:piece.x, startPieceY:piece.y
    };
    var handle = e.target.closest('.handle-edge');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    handle.addEventListener('pointermove', onStretchMove);
    handle.addEventListener('pointerup', onStretchEnd);
    handle.addEventListener('pointercancel', onStretchEnd);
  }
  function onStretchMove(e){
    if (!stretchDrag || e.pointerId!==stretchDrag.pointerId) return;
    var piece = getPiece(stretchDrag.uid);
    if (stretchDrag.mode === 'h'){
      var dxPct = (e.clientX - stretchDrag.startX) / stretchDrag.stageRect.width * 100;
      var newWidth = clamp(stretchDrag.startWidth + dxPct, MIN_WIDTH, 90);
      var deltaW = newWidth - stretchDrag.startWidth;
      piece.width = newWidth;
      piece.x = clamp(stretchDrag.startPieceX + deltaW/2, 0, 100); // left edge stays put
      stretchDrag.el.style.width = piece.width + '%';
      stretchDrag.el.style.left = piece.x + '%';
      applyStretchStyle(stretchDrag.el, piece);
    } else {
      var dyPct = (e.clientY - stretchDrag.startY) / stretchDrag.stageRect.height * 100;
      var newHeight = clamp(stretchDrag.startHeight + dyPct, 2, 90);
      var deltaH = newHeight - stretchDrag.startHeight;
      piece.height = newHeight;
      piece.y = clamp(stretchDrag.startPieceY + deltaH/2, 0, 100); // top edge stays put
      applyStretchStyle(stretchDrag.el, piece);
      stretchDrag.el.style.top = piece.y + '%';
    }
    updateLampLighting();
    positionToolbar();
  }
  function onStretchEnd(e){
    if (!stretchDrag || e.pointerId!==stretchDrag.pointerId) return;
    var handle = stretchDrag.el.querySelector('[data-handle="stretch-'+stretchDrag.mode+'"]');
    handle.removeEventListener('pointermove', onStretchMove);
    handle.removeEventListener('pointerup', onStretchEnd);
    handle.removeEventListener('pointercancel', onStretchEnd);
    stretchDrag = null;
  }

  /* ---------------- rotating ---------------- */
  var rotateDrag = null;
  function startRotate(e, uid, el){
    e.preventDefault();
    selectPiece(uid);
    var rect = el.getBoundingClientRect();
    rotateDrag = { pointerId:e.pointerId, uid:uid, el:el, cx:rect.left+rect.width/2, cy:rect.top+rect.height/2 };
    var handle = e.target.closest('.handle');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    handle.addEventListener('pointermove', onRotateMove);
    handle.addEventListener('pointerup', onRotateEnd);
    handle.addEventListener('pointercancel', onRotateEnd);
  }
  function onRotateMove(e){
    if (!rotateDrag || e.pointerId!==rotateDrag.pointerId) return;
    var piece = getPiece(rotateDrag.uid);
    var angle = Math.atan2(e.clientY-rotateDrag.cy, e.clientX-rotateDrag.cx) * 180/Math.PI + 90;
    angle = ((angle % 360) + 360) % 360;
    [0,90,180,270,360].forEach(function(snap){ if (Math.abs(angle-snap) < 4) angle = (snap===360?0:snap); });
    piece.rotation = angle;
    rotateDrag.el.style.transform = 'translate(-50%,-50%) rotate('+angle+'deg)';
    positionToolbar();
  }
  function onRotateEnd(e){
    if (!rotateDrag || e.pointerId!==rotateDrag.pointerId) return;
    var handle = rotateDrag.el.querySelector('[data-handle="rotate"]');
    handle.removeEventListener('pointermove', onRotateMove);
    handle.removeEventListener('pointerup', onRotateEnd);
    handle.removeEventListener('pointercancel', onRotateEnd);
    rotateDrag = null;
  }

  /* ---------------- floating toolbar ---------------- */
  function positionToolbar(){
    if (!state.selectedUid){ itemToolbar.classList.remove('visible'); return; }
    var el = pieceEl(state.selectedUid);
    if (!el){ itemToolbar.classList.remove('visible'); return; }
    var rect = el.getBoundingClientRect();
    itemToolbar.classList.add('visible');
    var top = rect.top - 12;
    var left = rect.left + rect.width/2;
    if (top < 60){
      itemToolbar.style.transform = 'translate(-50%, 12px)';
      itemToolbar.style.top = rect.bottom + 'px';
    } else {
      itemToolbar.style.transform = 'translate(-50%, -100%)';
      itemToolbar.style.top = top + 'px';
    }
    itemToolbar.style.left = left + 'px';
  }

  itemToolbar.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn || !state.selectedUid) return;
    var piece = getPiece(state.selectedUid);
    var action = btn.dataset.action;
    if (action==='front'){ bringToFront(piece); }
    if (action==='back'){ sendToBack(piece); }
    if (action==='step-forward'){ moveStepForward(piece); }
    if (action==='step-back'){ moveStepBackward(piece); }
    if (action==='flip'){ piece.flipped = !piece.flipped; pieceEl(piece.uid).classList.toggle('flipped', piece.flipped); }
    if (action==='view'){
      var viewAsset = getAsset(piece.assetId);
      var views = availableViews(viewAsset);
      var vIdx = views.indexOf(piece.viewRotation || 'front');
      piece.viewRotation = views[(vIdx+1) % views.length];
      var visualEl = pieceEl(piece.uid).querySelector('.piece-visual');
      if (visualEl){
        if (visualEl.tagName === 'IMG') visualEl.src = viewSrcFor(piece, viewAsset);
        else loadStretchableSvg(viewSrcFor(piece, viewAsset), visualEl); // already upgraded by a stretch
      }
      updateViewButtonUI();
    }
    if (action==='sway'){
      piece.swayLevel = ((piece.swayLevel || 0) + 1) % 4;
      updateSwayEligibility(pieceEl(piece.uid), piece, getAsset(piece.assetId));
      updateSwayButtonUI();
    }
    if (action==='light'){
      piece.lightIntensity = (piece.lightIntensity % 3) + 1;
      updateLampIntensityVar(pieceEl(piece.uid), piece, getAsset(piece.assetId));
      updateLampLighting();
      updateLightButtonUI();
    }
    if (action==='opacity'){
      var levels = [100,80,70];
      var idx = levels.indexOf(piece.transparency || 100);
      piece.transparency = levels[(idx+1) % levels.length];
      pieceEl(piece.uid).querySelector('.piece-visual').style.opacity = piece.transparency/100;
      updateOpacityButtonUI();
    }
    if (action==='duplicate'){
      var copy = { uid:'p'+(state.uidCounter++), roomId:piece.roomId, assetId:piece.assetId, x:clamp(piece.x+4,0,100), y:clamp(piece.y+4,0,100), width:piece.width, height:piece.height, rotation:piece.rotation, z:0, lampOn:piece.lampOn, flipped:piece.flipped, swayLevel:piece.swayLevel, transparency:piece.transparency, lightIntensity:piece.lightIntensity, viewRotation:piece.viewRotation, toggled:piece.toggled };
      state.placed.push(copy);
      reassignZIndices();
      renderPiece(copy, true);
      selectPiece(copy.uid);
      updateLampLighting();
    }
    if (action==='delete'){
      state.placed = state.placed.filter(function(p){ return p.uid!==piece.uid; });
      var node = pieceEl(piece.uid);
      if (node) node.remove();
      reassignZIndices();
      deselect();
      updateAllHints();
      updateLampLighting();
    }
  });

  /* ---------------- stage-level interactions ---------------- */
  var roomPanDrag = null;
  roomsViewport.addEventListener('pointerdown', function(e){
    if (e.target.classList.contains('room-stage') || e.target.classList.contains('stage-hint')){
      deselect();
      if (state.trayOpen) setTrayOpen(false);
      // click-and-drag panning is a desktop-mouse convenience; touch
      // devices already get native swipe-scrolling via touch-action, and
      // mixing the two would double up the movement
      if (e.pointerType === 'mouse'){
        var stageEl = e.target.closest('.room-stage');
        roomPanDrag = { pointerId:e.pointerId, startX:e.clientX, startScrollLeft:roomsViewport.scrollLeft, stageEl:stageEl };
        if (stageEl) stageEl.classList.add('panning');
        try{ roomsViewport.setPointerCapture(e.pointerId); }catch(err){}
      }
    }
  });
  roomsViewport.addEventListener('pointermove', function(e){
    if (!roomPanDrag || e.pointerId !== roomPanDrag.pointerId) return;
    var dx = e.clientX - roomPanDrag.startX;
    roomsViewport.scrollLeft = roomPanDrag.startScrollLeft - dx;
  });
  function snapToNearestRoom(){
    var viewportCenter = roomsViewport.scrollLeft + roomsViewport.clientWidth/2;
    var closest = null, closestDist = Infinity;
    state.rooms.forEach(function(room){
      var el = roomStageEl(room.id);
      if (!el) return;
      var center = el.offsetLeft + el.offsetWidth/2;
      var dist = Math.abs(center - viewportCenter);
      if (dist < closestDist){ closestDist = dist; closest = room; }
    });
    if (closest) focusRoom(closest.id);
  }
  function endRoomPan(e){
    if (!roomPanDrag || e.pointerId !== roomPanDrag.pointerId) return;
    if (roomPanDrag.stageEl) roomPanDrag.stageEl.classList.remove('panning');
    roomPanDrag = null;
    snapToNearestRoom();
  }
  roomsViewport.addEventListener('pointerup', endRoomPan);
  roomsViewport.addEventListener('pointercancel', endRoomPan);
  window.addEventListener('resize', positionToolbar);
  window.addEventListener('scroll', positionToolbar, true);

  document.addEventListener('keydown', function(e){
    if (!screens.builder.classList.contains('active')) return;
    if (!state.selectedUid) return;
    if (e.key === 'Delete' || e.key === 'Backspace'){
      e.preventDefault();
      itemToolbar.querySelector('[data-action="delete"]').click();
    }
    if (e.key === 'Escape') deselect();
  });

  /* ---------------- clear room ---------------- */
  var confirmingClear = false, confirmTimer = null;
  clearBtn.addEventListener('click', function(){
    if (!confirmingClear){
      confirmingClear = true;
      clearBtn.textContent = 'Click again to confirm';
      confirmTimer = setTimeout(function(){
        confirmingClear = false;
        clearBtn.textContent = 'Clear room';
      }, 3000);
      return;
    }
    clearTimeout(confirmTimer);
    confirmingClear = false;
    clearBtn.textContent = 'Clear room';
    state.placed = state.placed.filter(function(p){ return p.roomId !== state.focusedRoomId; });
    state.selectedUid = null;
    fullRerenderPieces();
    itemToolbar.classList.remove('visible');
  });

  /* ---------------- scoring: variety & balance ---------------- */
  function computeScore(){
    var placed = state.placed.filter(function(p){ return p.roomId === state.focusedRoomId; });
    var n = placed.length;
    if (n === 0) return null;

    var categoriesUsed = {}, assetsUsed = {}, sumWidth = 0;
    var zones = [false,false,false];
    placed.forEach(function(p){
      var asset = getAsset(p.assetId);
      categoriesUsed[asset.category] = true;
      assetsUsed[p.assetId] = true;
      sumWidth += p.width;
      var zoneIdx = p.x < 33.34 ? 0 : (p.x < 66.67 ? 1 : 2);
      zones[zoneIdx] = true;
    });

    var categoryScore = Math.round(Object.keys(categoriesUsed).length / CATEGORIES.length * 100);
    var varietyScore = Math.round(Object.keys(assetsUsed).length / Math.min(n, ITEMS.length) * 100);
    var coverageScore = clamp(100 - Math.abs(sumWidth - 55) * 2, 0, 100);
    var zonesUsed = zones.filter(Boolean).length;
    var spreadScore = n <= 1 ? 100 : Math.round(zonesUsed / 3 * 100);
    var spaceScore = Math.round(coverageScore * 0.6 + spreadScore * 0.4);
    var overall = Math.round((categoryScore + varietyScore + spaceScore) / 3);

    return { overall:overall, categoryScore:categoryScore, varietyScore:varietyScore, spaceScore:spaceScore };
  }

  function titleForScore(s){
    if (s >= 90) return 'A Roomstory Worth Telling';
    if (s >= 75) return 'Beautifully Balanced';
    if (s >= 50) return 'Well-Loved Room';
    if (s >= 25) return 'Getting Cozy';
    return 'Just Moved In';
  }

  finishBtn.addEventListener('click', function(){
    var result = computeScore();
    if (!result){
      finishBtn.classList.add('nudge');
      setTimeout(function(){ finishBtn.classList.remove('nudge'); }, 450);
      return;
    }
    document.getElementById('resultsTitle').textContent = titleForScore(result.overall);
    document.getElementById('resultsScore').innerHTML = result.overall + '<span>/100</span>';
    var rows = [
      { label:'Category mix', value:result.categoryScore },
      { label:'Fresh picks', value:result.varietyScore },
      { label:'Room balance', value:result.spaceScore }
    ];
    resultsBars.innerHTML = rows.map(function(r){
      return '<div class="result-bar-row"><div class="label-row"><span>'+r.label+'</span><span>'+r.value+'</span></div>' +
             '<div class="result-bar-track"><div class="result-bar-fill" style="width:'+r.value+'%"></div></div></div>';
    }).join('');
    resultsOverlay.classList.add('active');
  });

  document.getElementById('resultsClose').addEventListener('click', function(){ resultsOverlay.classList.remove('active'); });
  document.getElementById('resultsKeepBtn').addEventListener('click', function(){ resultsOverlay.classList.remove('active'); });
  document.getElementById('resultsChangeRoomBtn').addEventListener('click', function(){
    resultsOverlay.classList.remove('active');
    renderRoomGrid();
    showScreen('picker');
  });

  /* ---------------- ambient dust motes ---------------- */
  function createDustMotes(roomEl){
    var count = 13;
    for (var i=0;i<count;i++){
      var mote = document.createElement('div');
      mote.className = 'dust-mote';
      var size = 3.5 + Math.random()*5;
      mote.style.width = size+'px';
      mote.style.height = size+'px';
      mote.style.left = (Math.random()*100)+'%';
      mote.style.top = (30+Math.random()*65)+'%';
      mote.style.setProperty('--drift-x', (Math.random()*40-20).toFixed(0)+'px');
      mote.style.setProperty('--drift-y', (-(90+Math.random()*110)).toFixed(0)+'px');
      var duration = 14 + Math.random()*14;
      mote.style.animationDuration = duration.toFixed(1)+'s';
      mote.style.animationDelay = (Math.random()*-duration).toFixed(1)+'s';
      roomEl.appendChild(mote);
    }
  }

  /* ---------------- init ---------------- */
  var existingSave = loadSavedGame();
  if (existingSave){
    hasExistingSave = true;
    applySavedGame(existingSave);
    document.getElementById('titleStartBtn').textContent = 'Continue Decorating';
    document.getElementById('titleFreshBtn').style.display = 'block';
  }
  document.querySelector('.title-bg').style.backgroundImage = "url('"+bgThumbSrc(BACKGROUNDS[0])+"')";
  renderRoomGrid();
  renderRooms();
  renderTabs();
  renderTray();
  setTrayOpen(state.trayOpen);
  runWhenIdle(preloadAheadOfNeed);

  // autosave: a periodic snapshot covers virtually every change without
  // needing a save-hook wired into every single action in the game, and
  // the unload/visibility handlers catch the moment right before the
  // player actually leaves, so nothing from the last few seconds is lost
  setInterval(saveGame, 4000);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') saveGame();
  });

})();
</script>
</body>
</html>
