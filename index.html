<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Roomstories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,560;0,9..144,650;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4;
    --paper-light:#FCFAF3;
    --ink:#362B22;
    --ink-70:rgba(54,43,34,.72);
    --ink-55:rgba(54,43,34,.55);
    --ink-35:rgba(54,43,34,.35);
    --sage:#77896B;
    --sage-dark:#5C6E55;
    --clay:#BD7B52;
    --gold:#D9A344;
    --line:#E7DDC7;
    --line-strong:#D8CBAC;
    --overlay-dim:rgba(28,21,14,.58);
    --glass-bg:rgba(252,248,238,.40);
    --glass-bg-strong:rgba(252,249,240,.62);
    --glass-border:rgba(255,255,255,.55);
    --shadow-soft:0 1px 2px rgba(54,43,34,.06), 0 6px 18px rgba(54,43,34,.08);
    --shadow-card:0 1px 1px rgba(54,43,34,.05), 0 3px 10px rgba(54,43,34,.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Karla',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#FBF8F0 0%, #F2EBD8 100%);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button{ font-family:inherit; }

  .screen{ display:none; width:100%; }
  .screen.active{ display:block; }
  .screen.active.flex{ display:flex; }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{
    0%{ transform:scale(.55); opacity:0; }
    65%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  @keyframes nudgeShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-5px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(3px); }
  }

  /* =========================================================
     shared buttons
  ==========================================================*/
  .btn-primary, .btn-ghost{
    font-size:13.5px;
    font-weight:600;
    border-radius:999px;
    padding:10px 18px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .btn-primary{
    background:var(--sage);
    color:#fff;
    border:1px solid var(--sage);
    box-shadow:0 6px 16px rgba(92,110,85,.35);
  }
  .btn-primary:hover{ background:var(--sage-dark); border-color:var(--sage-dark); }
  .btn-primary.nudge{ animation:nudgeShake .4s ease; }
  .btn-ghost{
    background:var(--paper-light);
    color:var(--ink-70);
    border:1px solid var(--line-strong);
  }
  .btn-ghost:hover{ border-color:var(--sage); color:var(--sage-dark); }
  .btn-on-glass{
    background:rgba(255,255,255,.30);
    color:var(--ink);
    border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .btn-on-glass:hover{ background:rgba(255,255,255,.48); }

  /* =========================================================
     TITLE SCREEN
  ==========================================================*/
  .screen-title{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:24px;
  }
  .title-bg{
    position:absolute;
    inset:-24px;
    background-size:cover;
    background-position:center;
    filter:blur(18px) brightness(.62) saturate(1.05);
    transform:scale(1.06);
  }
  .title-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(40,30,20,.30), rgba(30,22,15,.55));
  }
  .title-card{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:420px;
    background:var(--paper-light);
    border-radius:28px;
    padding:46px 38px 38px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:fadeUp .5s ease;
  }
  .title-mark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:650;
    font-size:42px;
    color:var(--ink);
    margin:0 0 10px;
  }
  .title-tag{
    font-size:14.5px;
    color:var(--ink-55);
    margin:0 0 30px;
    line-height:1.5;
  }

  /* =========================================================
     ROOM PICKER SCREEN
  ==========================================================*/
  .screen-picker{ min-height:100vh; min-height:100dvh; padding:26px 24px 60px; }
  .picker-header{
    display:flex;
    align-items:center;
    gap:14px;
    max-width:920px;
    margin:0 auto 28px;
  }
  .picker-back{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    color:var(--ink-55); font-size:13.5px; font-weight:600;
    padding:6px 4px;
  }
  .picker-back:hover{ color:var(--ink); }
  .picker-back svg{ width:16px; height:16px; }
  .picker-heading{ max-width:920px; margin:0 auto 22px; }
  .picker-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:560;
    font-size:28px;
    margin:0 0 6px;
  }
  .picker-sub{ font-size:14px; color:var(--ink-55); margin:0; }
  .room-grid{
    max-width:920px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:18px;
  }
  .room-card{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:2.5px solid transparent;
    box-shadow:var(--shadow-card);
    background:var(--paper-light);
    padding:0;
    transition:transform .15s ease, border-color .15s ease;
  }
  .room-card:hover{ transform:translateY(-3px); }
  .room-card.active{ border-color:var(--gold); }
  .room-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .room-card.img-error{ background:var(--paper); }
  .room-card.img-error img{ opacity:0; }
  .room-card.img-error::after{
    content:'Image unavailable';
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:0 10px;
    font-size:11.5px; color:var(--ink-35);
  }
  .room-card-label{
    position:absolute; left:10px; bottom:10px;
    background:rgba(40,30,20,.55);
    color:#fff;
    font-size:12px; font-weight:600;
    padding:5px 11px;
    border-radius:999px;
    backdrop-filter:blur(4px);
  }
  .room-card-check{
    position:absolute; top:8px; right:8px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .room-card-check svg{ width:12px; height:12px; }
  .room-card-soon{
    width:100%;
    aspect-ratio:16/9;
    border-radius:16px;
    border:1.5px dashed var(--line-strong);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    color:var(--ink-35);
    font-size:12.5px;
    cursor:default;
  }
  .room-card-soon svg{ width:18px; height:18px; opacity:.6; }

  /* =========================================================
     BUILDER SCREEN
  ==========================================================*/
  .screen-builder{
    position:relative;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .stage{
    position:absolute;
    inset:0;
    touch-action:none;
    user-select:none;
  }
  .stage-bg-layer{
    position:absolute; inset:0;
    z-index:-1000;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 1s ease;
  }
  .stage-bg-layer.active{ opacity:1; }
  .stage.drop-active::after{
    content:'';
    position:absolute; inset:10px;
    border-radius:14px;
    box-shadow:inset 0 0 0 3px var(--sage);
    pointer-events:none;
  }
  .stage-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:0 30px;
    margin:0;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:20px;
    color:rgba(255,252,244,.85);
    text-shadow:0 2px 14px rgba(0,0,0,.4);
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage-hint.hidden{ opacity:0; }

  /* ambient dust motes — purely decorative, drift slowly through the room */
  .dust-mote{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,240,210,.95), rgba(255,240,210,0) 72%);
    pointer-events:none;
    z-index:400;
    opacity:0;
    animation-name:motesDrift;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes motesDrift{
    0%   { transform:translate(0,0); opacity:0; }
    12%  { opacity:.5; }
    88%  { opacity:.5; }
    100% { transform:translate(var(--drift-x,18px), var(--drift-y,-160px)); opacity:0; }
  }
  /* at night the same motes become slow-blinking fireflies instead of a
     steady fade — same drift path, no JS changes needed */
  .stage.lamps-lit .dust-mote{
    background:radial-gradient(circle, rgba(214,255,150,.95), rgba(214,255,150,0) 70%);
    animation-name:fireflyDrift;
  }
  @keyframes fireflyDrift{
    0%   { transform:translate(0,0); opacity:0; }
    8%   { opacity:.75; }
    20%  { opacity:.12; }
    32%  { opacity:.8; }
    46%  { opacity:.1; }
    60%  { opacity:.7; }
    74%  { opacity:.15; }
    88%  { opacity:.6; }
    100% { transform:translate(var(--drift-x,18px), var(--drift-y,-160px)); opacity:0; }
  }

  /* a very soft, slow cloud-shadow sweeping the room — deliberately
     imprecise, sits behind the furniture with the background */
  .cloud-shadow{
    position:absolute;
    top:-30%; left:-45%;
    width:95%; height:160%;
    border-radius:50%;
    background:radial-gradient(ellipse, rgba(35,30,45,.09), rgba(35,30,45,0) 70%);
    filter:blur(55px);
    pointer-events:none;
    z-index:-500;
    animation:cloudDrift 75s ease-in-out infinite alternate;
  }
  @keyframes cloudDrift{
    0%   { transform:translateX(0); }
    100% { transform:translateX(160%); }
  }

  /* the faintest suggestion of shifting daylight — kept deliberately
     subtle (alpha only ever moves between ~.02 and ~.05) after the plant
     sway feedback; this should be felt more than seen */
  .breathing-light{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:450;
    background:radial-gradient(circle at 50% 35%, rgba(255,250,235,.05), rgba(255,250,235,0) 65%);
    animation:breathe 12s ease-in-out infinite;
  }
  @keyframes breathe{
    0%, 100% { opacity:.4; }
    50%      { opacity:1; }
  }

  .stage-vignette-top{
    position:absolute; left:0; right:0;
    pointer-events:none;
    z-index:-999;
    top:0; height:130px;
    background:linear-gradient(180deg, rgba(20,15,10,.35), rgba(20,15,10,0));
  }

  /* day/night lighting overlay — sits above the background and every placed
     piece, below all floating UI, so the whole room dims and tints together */
  .night-overlay{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:500;
    opacity:0;
    transition:opacity 1.1s ease, background 1.1s ease;
  }
  .night-overlay.tint-dawn{ opacity:1; background:linear-gradient(200deg, rgba(110,52,54,.34), rgba(168,96,58,.24)); }
  .night-overlay.tint-dusk{ opacity:1; background:linear-gradient(200deg, rgba(90,40,70,.42), rgba(190,100,50,.30)); }
  .night-overlay.tint-night{ opacity:1; background:linear-gradient(200deg, rgba(23,20,52,.55), rgba(41,28,58,.40)); }

  /* top bar */
  .builder-topbar{
    position:absolute;
    top:16px; left:16px; right:16px;
    z-index:3000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .builder-brand{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:560;
    font-size:18px;
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  .builder-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .time-controls{ display:flex; gap:6px; align-items:center; }
  .time-btn{
    width:36px; height:36px;
    border-radius:50%;
    padding:0;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    background:rgba(255,255,255,.30);
    color:var(--ink);
    border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    cursor:pointer;
    transition:background .15s ease, box-shadow .15s ease;
  }
  .time-btn:hover{ background:rgba(255,255,255,.48); }
  .time-btn.active{ background:var(--ink); color:#fff; box-shadow:0 0 0 2px var(--gold); }
  .time-btn svg{ width:17px; height:17px; }

  /* =========================================================
     placed pieces
  ==========================================================*/
  .piece{
    position:absolute;
    top:0; left:0;
    transform-origin:center center;
    will-change:transform, width;
  }
  .piece-inner{ position:relative; width:100%; }
  .lamp-glow{
    position:absolute;
    top:50%; left:50%;
    width:240%; height:240%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,206,130,.85) 0%, rgba(255,196,110,.32) 38%, rgba(255,196,110,0) 72%);
    opacity:.16;
    pointer-events:none;
    transition:opacity 1.1s ease;
  }
  .stage.lamps-lit .lamp-glow{ opacity:.85; }
  .stage.lamps-lit .piece.lamp-off .lamp-glow{ opacity:.16; }
  @keyframes lampBreathe{ 0%,100%{ opacity:.78; } 50%{ opacity:.92; } }
  .stage.lamps-lit .piece:not(.lamp-off) .lamp-glow{ animation:lampBreathe 3.4s ease-in-out infinite; }

  /* gentle plant sway — pivots from the base, like it's rooted in a pot.
     Rotation displacement grows with distance from the pivot, so at a small
     angle the base barely shifts while the top does almost all the moving.
     Only "big" plants qualify (see sway-eligible in JS), and it's slow and
     minimal by design. */
  @keyframes plantSway{
    0%   { transform:rotate(-0.5deg); }
    50%  { transform:rotate(0.5deg); }
    100% { transform:rotate(-0.5deg); }
  }
  .piece.sway-eligible .piece-inner{
    transform-origin:50% 100%;
    animation:plantSway 6s ease-in-out infinite;
    animation-duration:var(--sway-duration, 11s);
    animation-delay:var(--sway-delay, 0s);
  }
  .piece-inner img{
    position:relative;
    width:100%; height:auto;
    display:block;
    object-fit:contain;
    pointer-events:none;
    filter:drop-shadow(0 10px 14px rgba(30,22,14,.30));
    transition:transform .2s ease;
  }
  .piece.flipped .piece-inner img{ transform:scaleX(-1); }
  .piece-outline{
    position:absolute; inset:0;
    border-radius:6px;
    box-shadow:0 0 0 1.6px #fff, 0 0 0 3px rgba(20,15,10,.22);
    opacity:0;
    pointer-events:none;
    transition:opacity .12s ease;
  }
  .piece.selected .piece-outline{ opacity:1; }

  .handle{
    position:absolute;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--paper-light);
    border:1.5px solid var(--gold);
    box-shadow:0 1px 3px rgba(0,0,0,.25);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .piece.selected .handle{ display:flex; }
  .handle-resize{ right:-8px; bottom:-8px; cursor:nwse-resize; }
  .handle-rotate{ top:-30px; left:50%; transform:translateX(-50%); cursor:grab; }
  .handle-rotate::before{
    content:'';
    position:absolute; top:16px; left:50%;
    width:1px; height:14px;
    background:var(--gold);
    transform:translateX(-50%);
    opacity:.85;
  }
  .handle svg{ width:9px; height:9px; }
  .piece.dragging, .piece.dragging *{ cursor:grabbing !important; }
  .piece-inner.pop{ animation:popIn .32s cubic-bezier(.2,.9,.3,1.2); }

  /* touch devices get noticeably bigger grab targets on the resize/rotate
     handles — keyed off input precision, not screen size, so a touchscreen
     laptop still gets this and a mouse on a small window doesn't */
  @media (pointer: coarse){
    .handle{ width:26px; height:26px; }
    .handle-resize{ right:-13px; bottom:-13px; }
    .handle-rotate{ top:-42px; }
    .handle-rotate::before{ top:26px; height:16px; }
    .handle svg{ width:14px; height:14px; }
  }

  /* floating selection toolbar */
  .item-toolbar{
    position:fixed;
    display:none;
    gap:4px;
    background:var(--ink);
    padding:6px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.28);
    z-index:4000;
    transform:translate(-50%,-100%);
  }
  .item-toolbar.visible{ display:flex; }
  .item-toolbar button{
    width:30px; height:30px;
    border:none; background:transparent;
    border-radius:8px;
    color:#F6F1E4;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .12s ease;
  }
  .item-toolbar button:hover{ background:rgba(255,255,255,.14); }
  .item-toolbar button.danger:hover{ background:var(--clay); }
  .item-toolbar svg{ width:16px; height:16px; }
  .item-toolbar .divider{ width:1px; background:rgba(255,255,255,.18); margin:4px 2px; }

  /* =========================================================
     GLASS TRAY (compact, right-side, toggleable)
  ==========================================================*/
  .tray-toggle{
    position:fixed;
    right:18px; bottom:18px;
    width:50px; height:50px;
    border-radius:50%;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:0 10px 26px rgba(20,15,10,.30);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:3100;
    color:var(--ink);
    padding:0;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .tray-toggle:hover{ transform:translateY(-2px); }
  .tray-toggle.open{ background:var(--ink); color:#fff; }
  .tray-toggle svg{ width:19px; height:19px; }
  .tray-toggle .icon-close{ display:none; }
  .tray-toggle.open .icon-open{ display:none; }
  .tray-toggle.open .icon-close{ display:block; }

  .tray-panel{
    position:fixed;
    right:18px; bottom:80px;
    width:210px;
    max-height:min(74vh, 620px);
    z-index:3000;
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--glass-border);
    border-radius:20px;
    box-shadow:0 14px 40px rgba(20,15,10,.32), inset 0 1px 0 rgba(255,255,255,.35);
    padding:10px 10px 10px;
    display:flex;
    flex-direction:column;
    transform-origin:bottom right;
    transition:opacity .16s ease, transform .16s ease;
  }
  .tray-panel.hidden{
    opacity:0;
    transform:scale(.9) translateY(8px);
    pointer-events:none;
  }
  .tray-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    margin-bottom:8px;
  }
  .tab{
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-70);
    background:transparent;
    border:none;
    padding:4px 9px;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{ background:var(--ink); color:#fff; }
  .tab:not(.active):hover{ background:rgba(54,43,34,.08); }

  .tray-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    overflow-y:auto;
    padding-right:2px;
  }
  .sticker{
    background:var(--glass-bg-strong);
    border:1px solid rgba(255,255,255,.6);
    border-radius:13px;
    padding:7px 5px 6px;
    text-align:center;
    cursor:grab;
    transform:rotate(var(--tilt,0deg));
    transition:transform .16s ease, box-shadow .16s ease, background .16s ease;
    touch-action:none;
    user-select:none;
  }
  .sticker:hover{
    transform:rotate(0deg) translateY(-2px);
    background:var(--paper-light);
    box-shadow:0 6px 16px rgba(20,15,10,.20);
  }
  .sticker-thumb{
    width:100%; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:4px;
    pointer-events:none;
  }
  .sticker-thumb img{
    max-width:88%; max-height:88%;
    object-fit:contain;
    filter:drop-shadow(0 6px 8px rgba(30,22,14,.20));
  }
  .sticker-label{
    font-size:9px;
    font-weight:600;
    color:var(--ink-70);
    line-height:1.2;
    pointer-events:none;
  }

  /* mute toggle */
  .mute-toggle{
    position:fixed;
    top:14px; left:50%;
    transform:translateX(-50%);
    width:38px; height:38px;
    border-radius:50%;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border);
    box-shadow:0 6px 16px rgba(20,15,10,.25);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:7000;
    color:var(--ink);
    padding:0;
  }
  .mute-toggle:hover{ background:var(--paper-light); }
  .mute-toggle svg{ width:16px; height:16px; }
  .mute-toggle .icon-muted{ display:none; }
  .mute-toggle.muted .icon-unmuted{ display:none; }
  .mute-toggle.muted .icon-muted{ display:block; }

  /* drag ghost */
  .drag-ghost{
    position:fixed; top:0; left:0;
    width:110px;
    pointer-events:none;
    z-index:5000;
    opacity:0;
    display:none;
    transform:translate(-50%,-50%);
  }
  .drag-ghost img{
    width:100%; display:block;
    filter:drop-shadow(0 10px 16px rgba(30,22,14,.35));
  }

  /* =========================================================
     RESULTS OVERLAY
  ==========================================================*/
  .results-overlay{
    position:fixed; inset:0;
    background:var(--overlay-dim);
    z-index:6000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .results-overlay.active{ display:flex; }
  .results-card{
    position:relative;
    background:var(--paper-light);
    border-radius:26px;
    padding:34px 30px 28px;
    max-width:380px;
    width:100%;
    text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:popIn .32s cubic-bezier(.2,.9,.3,1.15);
  }
  .results-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none;
    font-size:22px; line-height:1;
    color:var(--ink-35);
    cursor:pointer;
  }
  .results-close:hover{ color:var(--ink); }
  .results-eyebrow{ font-size:12.5px; color:var(--ink-55); display:block; margin-bottom:4px; }
  .results-title{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:25px;
    margin:0 0 12px;
  }
  .results-score{
    font-family:'Fraunces',serif;
    font-weight:650;
    font-size:46px;
    color:var(--sage-dark);
    margin-bottom:20px;
  }
  .results-score span{
    font-size:17px;
    color:var(--ink-35);
    font-family:'Karla',sans-serif;
    font-weight:600;
  }
  .results-bars{ display:flex; flex-direction:column; gap:12px; margin-bottom:24px; text-align:left; }
  .result-bar-row .label-row{
    display:flex; justify-content:space-between;
    font-size:12.5px; font-weight:600; color:var(--ink-70);

  }

  .result-bar-fill{ height:100%; border-radius:99px; background:var(--sage); transition:width .5s cubic-bezier(.2,.8,.3,1); }
  .results-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;

  var CATEGORIES = [

  var MIN_WIDTH = 4, MAX_WIDTH = 65;

  var TIME_ICONS = {
    sun:  '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 3v1.6M10 15.4V17M3 10h1.6M15.4 10H17M5.1 5.1l1.15 1.15M13.75 13.75l1.15 1.15M14.9 5.1l-1.15 1.15M6.25 13.75 5.1 14.9"/></svg>',
    moon: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11.5A6.5 6.5 0 0 1 8.5 4a6.5 6.5 0 1 0 7.5 7.5Z"/></svg>',
    dawn: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h12"/><path d="M6.5 14a3.5 3.5 0 0 1 7 0"/><path d="M8.3 5.8 10 4l1.7 1.8"/><path d="M10 4v3"/></svg>',

  /* ---------------- state ---------------- */
  var state = {
    activeCategory: 'seating',

  function getAsset(id){ for (var i=0;i<ITEMS.length;i++) if (ITEMS[i].id===id) return ITEMS[i]; return null; }
  function getBackground(id){ for (var i=0;i<BACKGROUNDS.length;i++) if (BACKGROUNDS[i].id===id) return BACKGROUNDS[i]; return null; }
  function getPiece(uid){ for (var i=0;i<state.placed.length;i++) if (state.placed[i].uid===uid) return state.placed[i]; return null; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  /* ---------------- dom refs ---------------- */
  var screens = {
    title: document.getElementById('screen-title'),

  /* ---------------- screen navigation ---------------- */
  muteToggle.addEventListener('click', function(){
    bgMusic.muted = !bgMusic.muted;
    muteToggle.classList.toggle('muted', bgMusic.muted);
    muteToggle.setAttribute('aria-pressed', bgMusic.muted ? 'true' : 'false');
  });

  function showScreen(name){
    Object.keys(screens).forEach(function(key){
      var isTitle = key === 'title';
      screens[key].classList.toggle('active', key === name);
      if (key === name && isTitle) screens[key].classList.add('flex');
    });
  }

  document.getElementById('titleStartBtn').addEventListener('click', function(){
    showScreen('picker');
    bgMusic.play().catch(function(){});
  });
  document.getElementById('pickerBackBtn').addEventListener('click', function(){
    showScreen('title');
  });
  changeRoomBtn.addEventListener('click', function(){
    renderRoomGrid();
    showScreen('picker');
  });

  /* ---------------- deterministic tilt for stickers ---------------- */
  function tiltFor(id){
    var h = 0;
    for (var i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) % 1000;
    return ((h/1000)*4.4 - 2.2).toFixed(2);
  }

  /* ---------------- render: room picker ---------------- */
  function renderRoomGrid(){
    roomGrid.innerHTML = '';
    BACKGROUNDS.forEach(function(bg){
      var isActive = bg.id === state.activeBackground;
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'room-card' + (isActive ? ' active' : '');
      card.innerHTML =
        '<img src="'+bg.src+'" alt="'+bg.name+'" loading="lazy">' +
        '<span class="room-card-label">'+bg.name+'</span>' +
        (isActive ? '<span class="room-card-check"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 8 14l8-8"/></svg></span>' : '');
      card.querySelector('img').addEventListener('error', function(){ card.classList.add('img-error'); });
      card.addEventListener('click', function(){
        state.activeBackground = bg.id;
        refreshRoomVisuals();
        renderTimeControls();
        showScreen('builder');
      });
      roomGrid.appendChild(card);
    });
    var soon = document.createElement('div');
    soon.className = 'room-card-soon';
    soon.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg><span>More rooms soon</span>';
    roomGrid.appendChild(soon);
  }
  var activeBgLayer = null;
  function currentTimeSrc(){
    var bg = getBackground(state.activeBackground);
    if (bg.times){
      var t = bg.times.filter(function(t){ return t.id === state.activeTime; })[0] || bg.times[0];
      return t.src;
    }
    return (state.isNight && bg.nightSrc) ? bg.nightSrc : bg.src;
  }
  function applyBackground(){
    var src = currentTimeSrc();
    var incoming = activeBgLayer === stageBgA ? stageBgB : stageBgA;
    var img = new Image();
    img.onload = function(){
      incoming.style.backgroundImage = "url('"+src+"')";
      incoming.classList.add('active');
      if (activeBgLayer) activeBgLayer.classList.remove('active');
      activeBgLayer = incoming;
    };
    img.src = src;
  }
  function updateNightOverlay(){
    var bg = getBackground(state.activeBackground);
    nightOverlay.classList.remove('tint-dawn','tint-dusk','tint-night');
    if (bg.times){
      if (state.activeTime === 'dawn') nightOverlay.classList.add('tint-dawn');
      else if (state.activeTime === 'dusk') nightOverlay.classList.add('tint-dusk');
      else if (state.activeTime === 'night') nightOverlay.classList.add('tint-night');
    } else if (state.isNight){
      nightOverlay.classList.add('tint-night');
    }
  }
  function updateLampsLit(){
    var bg = getBackground(state.activeBackground);
    var lit = bg.times ? (state.activeTime==='dusk' || state.activeTime==='night') : state.isNight;
    stage.classList.toggle('lamps-lit', lit);
  }
  function refreshRoomVisuals(){
    applyBackground();
    updateNightOverlay();
    updateLampsLit();
  }
  function renderTimeControls(){
    var bg = getBackground(state.activeBackground);
    timeControls.innerHTML = '';
    if (bg.times){
      bg.times.forEach(function(t){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'time-btn' + (state.activeTime===t.id ? ' active' : '');
        btn.title = t.label;
        btn.setAttribute('aria-label', t.label);
        btn.innerHTML = TIME_ICONS[t.icon];
        btn.addEventListener('click', function(){
          if (state.activeTime === t.id) return;
          state.activeTime = t.id;
          refreshRoomVisuals();
          renderTimeControls();
        });
        timeControls.appendChild(btn);
      });
    } else {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'time-btn' + (state.isNight ? ' active' : '');
      btn.title = state.isNight ? 'Switch to day' : 'Switch to night';
      btn.setAttribute('aria-label', btn.title);
      btn.innerHTML = TIME_ICONS[state.isNight ? 'moon' : 'sun'];
      btn.addEventListener('click', function(){
        state.isNight = !state.isNight;
        refreshRoomVisuals();
        renderTimeControls();
      });
      timeControls.appendChild(btn);
    }
  }

  /* ---------------- render: tray ---------------- */
  function renderTabs(){
    trayTabs.innerHTML = '';
    CATEGORIES.forEach(function(cat){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab' + (cat.id===state.activeCategory ? ' active' : '');
      btn.textContent = cat.label;
      btn.addEventListener('click', function(){
        state.activeCategory = cat.id;
        renderTabs();
        renderTray();
      });
      trayTabs.appendChild(btn);
    });
  }

  function renderTray(){
    trayGrid.innerHTML = '';
    ITEMS.filter(function(it){ return it.category===state.activeCategory; }).forEach(function(item){
      var card = document.createElement('div');
      card.className = 'sticker';
      card.style.setProperty('--tilt', tiltFor(item.id)+'deg');
      card.innerHTML =
        '<div class="sticker-thumb"><img src="'+item.src+'" alt=""></div>' +
        '<div class="sticker-label">'+item.name+'</div>';
      card.addEventListener('pointerdown', function(e){ startTrayDrag(e, item, card); });
      trayGrid.appendChild(card);
    });
  }

  /* ---------------- hit-testing helper (glass tray floats over the stage) ---------------- */
  function isOverStage(x, y){
    var topEl = document.elementFromPoint(x, y);
    if (!topEl) return false;
    if (topEl.closest('.tray-panel') || topEl.closest('.tray-toggle') || topEl.closest('.builder-topbar')) return false;
    return !!topEl.closest('#stage');
  }

  /* ---------------- show / hide the items panel ---------------- */
  function setTrayOpen(open){
    state.trayOpen = open;
    trayPanel.classList.toggle('hidden', !open);
    trayToggle.classList.toggle('open', open);
    trayToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  trayToggle.addEventListener('click', function(){ setTrayOpen(!state.trayOpen); });

  /* ---------------- placing from tray ---------------- */
  var trayDrag = null;

  function startTrayDrag(e, item, cardEl){
    e.preventDefault();
    try{ cardEl.setPointerCapture(e.pointerId); }catch(err){}
    trayDrag = { pointerId:e.pointerId, item:item, cardEl:cardEl, startX:e.clientX, startY:e.clientY, moved:false };
    dragGhostImg.src = item.src;
    dragGhost.style.transform = 'translate(-50%,-50%) rotate('+tiltFor(item.id)+'deg)';

    cardEl.addEventListener('pointermove', onTrayDragMove);
    cardEl.addEventListener('pointerup', onTrayDragEnd);
    cardEl.addEventListener('pointercancel', onTrayDragEnd);
  }

  function onTrayDragMove(e){
    if (!trayDrag || e.pointerId !== trayDrag.pointerId) return;
    var dx = e.clientX - trayDrag.startX, dy = e.clientY - trayDrag.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) trayDrag.moved = true;
    if (!trayDrag.moved) return;

    dragGhost.style.display = 'block';
    dragGhost.style.opacity = '0.92';
    dragGhost.style.left = e.clientX + 'px';
    dragGhost.style.top = e.clientY + 'px';

    stage.classList.toggle('drop-active', isOverStage(e.clientX, e.clientY));
  }

  function onTrayDragEnd(e){
    if (!trayDrag || e.pointerId !== trayDrag.pointerId) return;
    var d = trayDrag;
    d.cardEl.removeEventListener('pointermove', onTrayDragMove);
    d.cardEl.removeEventListener('pointerup', onTrayDragEnd);
    d.cardEl.removeEventListener('pointercancel', onTrayDragEnd);
    dragGhost.style.display = 'none';
    dragGhost.style.opacity = '0';
    stage.classList.remove('drop-active');

    var over = isOverStage(e.clientX, e.clientY);
    var rect = stage.getBoundingClientRect();

    if (!d.moved){
      var jx = 50 + (Math.random()*16-8);
      var jy = 48 + (Math.random()*10-5);
      addPiece(d.item, clamp(jx,4,96), clamp(jy,4,96));
    } else if (over){
      var xPct = (e.clientX - rect.left) / rect.width * 100;
      var yPct = (e.clientY - rect.top) / rect.height * 100;
      addPiece(d.item, clamp(xPct,0,100), clamp(yPct,0,100));
    }
    trayDrag = null;
  }

  function addPiece(item, xPct, yPct){
    var piece = { uid:'p'+(state.uidCounter++), assetId:item.id, x:xPct, y:yPct, width:item.defaultWidth, rotation:0, z:state.nextZ++, lampOn:true, flipped:false };
    state.placed.push(piece);
    renderPiece(piece, true);
    selectPiece(piece.uid);
    updateHint();
  }

  var SWAY_MIN_WIDTH = 18; // only plants rendered at roughly Large size or bigger sway

  function updateSwayEligibility(el, piece, asset){
    var eligible = asset.category === 'plants' && piece.width >= SWAY_MIN_WIDTH;
    el.classList.toggle('sway-eligible', eligible);
  }

  /* ---------------- rendering placed pieces ---------------- */
  function renderPiece(piece, animate){
    var asset = getAsset(piece.assetId);
    var el = document.createElement('div');
    el.className = 'piece' +
      (asset.category==='lighting' && !piece.lampOn ? ' lamp-off' : '') +
      (piece.flipped ? ' flipped' : '');
    el.dataset.uid = piece.uid;
    el.dataset.category = asset.category;
    updateSwayEligibility(el, piece, asset);
    if (asset.category === 'plants'){
      el.style.setProperty('--sway-duration', (9 + Math.random()*4).toFixed(2)+'s');
      el.style.setProperty('--sway-delay', (Math.random()*-12).toFixed(2)+'s');
    }
    el.style.left = piece.x + '%';
    el.style.top = piece.y + '%';
    el.style.width = piece.width + '%';
    el.style.zIndex = piece.z;
    el.style.transform = 'translate(-50%,-50%) rotate('+piece.rotation+'deg)';

    el.innerHTML =
      '<div class="piece-inner'+(animate?' pop':'')+'">' +
        (asset.category==='lighting' ? '<div class="lamp-glow"></div>' : '') +
        '<img src="'+asset.src+'" alt="'+asset.name+'">' +
        '<div class="piece-outline"></div>' +
        '<div class="handle handle-rotate" data-handle="rotate"><svg viewBox="0 0 20 20" fill="none" stroke="#BD7B52" stroke-width="1.6" stroke-linecap="round"><path d="M6 6a5 5 0 1 1-1 3"/><path d="M5 4v3h3"/></svg></div>' +
        '<div class="handle handle-resize" data-handle="resize"></div>' +
      '</div>';

    stage.appendChild(el);

    var innerEl = el.querySelector('.piece-inner');
    if (animate) innerEl.addEventListener('animationend', function(){ innerEl.classList.remove('pop'); }, {once:true});

    el.addEventListener('pointerdown', function(e){ onPieceDown(e, piece.uid, el); });
    el.querySelector('[data-handle="resize"]').addEventListener('pointerdown', function(e){ e.stopPropagation(); startResize(e, piece.uid, el); });
    el.querySelector('[data-handle="rotate"]').addEventListener('pointerdown', function(e){ e.stopPropagation(); startRotate(e, piece.uid, el); });
  }

  function fullRerenderPieces(){
    Array.prototype.slice.call(stage.querySelectorAll('.piece')).forEach(function(n){ n.remove(); });
    state.placed.slice().sort(function(a,b){ return a.z-b.z; }).forEach(function(p){ renderPiece(p,false); });
    if (state.selectedUid) applySelectionClass();
    updateHint();
  }

  function pieceEl(uid){ return stage.querySelector('.piece[data-uid="'+uid+'"]'); }

  function applySelectionClass(){
    Array.prototype.slice.call(stage.querySelectorAll('.piece')).forEach(function(n){
      n.classList.toggle('selected', n.dataset.uid === state.selectedUid);
    });
  }

  function selectPiece(uid){ state.selectedUid = uid; applySelectionClass(); positionToolbar(); }
  function deselect(){ state.selectedUid = null; applySelectionClass(); itemToolbar.classList.remove('visible'); }
  function updateHint(){ stageHint.classList.toggle('hidden', state.placed.length > 0); }

  /* ---------------- moving a placed piece ---------------- */
  var moveDrag = null;
  function onPieceDown(e, uid, el){
    if (e.target.closest('[data-handle]')) return;
    e.preventDefault();
    selectPiece(uid);
    var piece = getPiece(uid);
    var rect = stage.getBoundingClientRect();
    moveDrag = { pointerId:e.pointerId, uid:uid, el:el, rect:rect, startX:e.clientX, startY:e.clientY, startPctX:piece.x, startPctY:piece.y, moved:false };
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    el.addEventListener('pointermove', onMoveMove);
    el.addEventListener('pointerup', onMoveEnd);
    el.addEventListener('pointercancel', onMoveEnd);
  }
  function onMoveMove(e){
    if (!moveDrag || e.pointerId!==moveDrag.pointerId) return;
    if (Math.abs(e.clientX-moveDrag.startX) > 4 || Math.abs(e.clientY-moveDrag.startY) > 4) moveDrag.moved = true;
    var piece = getPiece(moveDrag.uid);
    var dxPct = (e.clientX - moveDrag.startX) / moveDrag.rect.width * 100;
    var dyPct = (e.clientY - moveDrag.startY) / moveDrag.rect.height * 100;
    piece.x = clamp(moveDrag.startPctX + dxPct, 0, 100);
    piece.y = clamp(moveDrag.startPctY + dyPct, 0, 100);
    moveDrag.el.style.left = piece.x + '%';
    moveDrag.el.style.top = piece.y + '%';
    positionToolbar();
  }
  function onMoveEnd(e){
    if (!moveDrag || e.pointerId!==moveDrag.pointerId) return;
    if (!moveDrag.moved){
      var piece = getPiece(moveDrag.uid);
      var asset = getAsset(piece.assetId);
      if (asset.category === 'lighting'){
        piece.lampOn = !piece.lampOn;
        moveDrag.el.classList.toggle('lamp-off', !piece.lampOn);
      }
    }
    moveDrag.el.classList.remove('dragging');
    moveDrag.el.removeEventListener('pointermove', onMoveMove);
    moveDrag.el.removeEventListener('pointerup', onMoveEnd);
    moveDrag.el.removeEventListener('pointercancel', onMoveEnd);
    moveDrag = null;
  }

  /* ---------------- resizing ---------------- */
  var resizeDrag = null;
  function startResize(e, uid, el){
    e.preventDefault();
    selectPiece(uid);
    var piece = getPiece(uid);
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    var startDist = Math.hypot(e.clientX-cx, e.clientY-cy);
    resizeDrag = { pointerId:e.pointerId, uid:uid, el:el, cx:cx, cy:cy, startDist:startDist, startWidth:piece.width };
    var handle = e.target.closest('.handle');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    handle.addEventListener('pointermove', onResizeMove);
    handle.addEventListener('pointerup', onResizeEnd);
    handle.addEventListener('pointercancel', onResizeEnd);
  }
  function onResizeMove(e){
    if (!resizeDrag || e.pointerId!==resizeDrag.pointerId) return;
    var piece = getPiece(resizeDrag.uid);
    var dist = Math.hypot(e.clientX-resizeDrag.cx, e.clientY-resizeDrag.cy);
    var scale = dist / Math.max(resizeDrag.startDist, 1);
    piece.width = clamp(resizeDrag.startWidth * scale, MIN_WIDTH, MAX_WIDTH);
    resizeDrag.el.style.width = piece.width + '%';
    updateSwayEligibility(resizeDrag.el, piece, getAsset(piece.assetId));
    positionToolbar();
  }
  function onResizeEnd(e){
    if (!resizeDrag || e.pointerId!==resizeDrag.pointerId) return;
    var handle = resizeDrag.el.querySelector('[data-handle="resize"]');
    handle.removeEventListener('pointermove', onResizeMove);
    handle.removeEventListener('pointerup', onResizeEnd);
    handle.removeEventListener('pointercancel', onResizeEnd);
    resizeDrag = null;
  }

  /* ---------------- rotating ---------------- */
  var rotateDrag = null;
  function startRotate(e, uid, el){
    e.preventDefault();
    selectPiece(uid);
    var rect = el.getBoundingClientRect();
    rotateDrag = { pointerId:e.pointerId, uid:uid, el:el, cx:rect.left+rect.width/2, cy:rect.top+rect.height/2 };
    var handle = e.target.closest('.handle');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    handle.addEventListener('pointermove', onRotateMove);
    handle.addEventListener('pointerup', onRotateEnd);
    handle.addEventListener('pointercancel', onRotateEnd);
  }
  function onRotateMove(e){
    if (!rotateDrag || e.pointerId!==rotateDrag.pointerId) return;
    var piece = getPiece(rotateDrag.uid);
    var angle = Math.atan2(e.clientY-rotateDrag.cy, e.clientX-rotateDrag.cx) * 180/Math.PI + 90;
    angle = ((angle % 360) + 360) % 360;
    [0,90,180,270,360].forEach(function(snap){ if (Math.abs(angle-snap) < 4) angle = (snap===360?0:snap); });
    piece.rotation = angle;
    rotateDrag.el.style.transform = 'translate(-50%,-50%) rotate('+angle+'deg)';
    positionToolbar();
  }
  function onRotateEnd(e){
    if (!rotateDrag || e.pointerId!==rotateDrag.pointerId) return;
    var handle = rotateDrag.el.querySelector('[data-handle="rotate"]');
    handle.removeEventListener('pointermove', onRotateMove);
    handle.removeEventListener('pointerup', onRotateEnd);
    handle.removeEventListener('pointercancel', onRotateEnd);
    rotateDrag = null;
  }

  /* ---------------- floating toolbar ---------------- */
  function positionToolbar(){
    if (!state.selectedUid){ itemToolbar.classList.remove('visible'); return; }
    var el = pieceEl(state.selectedUid);
    if (!el){ itemToolbar.classList.remove('visible'); return; }
    var rect = el.getBoundingClientRect();
    itemToolbar.classList.add('visible');
    var top = rect.top - 12;
    var left = rect.left + rect.width/2;
    if (top < 60){
      itemToolbar.style.transform = 'translate(-50%, 12px)';
      itemToolbar.style.top = rect.bottom + 'px';
    } else {
      itemToolbar.style.transform = 'translate(-50%, -100%)';
      itemToolbar.style.top = top + 'px';
    }
    itemToolbar.style.left = left + 'px';
  }

  itemToolbar.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn || !state.selectedUid) return;
    var piece = getPiece(state.selectedUid);
    var action = btn.dataset.action;
    if (action==='front'){ piece.z = state.nextZ++; pieceEl(piece.uid).style.zIndex = piece.z; }
    if (action==='back'){ piece.z = --state.minZ; pieceEl(piece.uid).style.zIndex = piece.z; }
    if (action==='flip'){ piece.flipped = !piece.flipped; pieceEl(piece.uid).classList.toggle('flipped', piece.flipped); }
    if (action==='duplicate'){
      var copy = { uid:'p'+(state.uidCounter++), assetId:piece.assetId, x:clamp(piece.x+4,0,100), y:clamp(piece.y+4,0,100), width:piece.width, rotation:piece.rotation, z:state.nextZ++, lampOn:piece.lampOn, flipped:piece.flipped };
      state.placed.push(copy);
      renderPiece(copy, true);
      selectPiece(copy.uid);
    }
    if (action==='delete'){
      state.placed = state.placed.filter(function(p){ return p.uid!==piece.uid; });
      var node = pieceEl(piece.uid);
      if (node) node.remove();
      deselect();
      updateHint();
    }
  });

  /* ---------------- stage-level interactions ---------------- */
  stage.addEventListener('pointerdown', function(e){
    if (e.target === stage || e.target === stageHint){
      deselect();
      if (state.trayOpen) setTrayOpen(false);
    }
  });
  window.addEventListener('resize', positionToolbar);
  window.addEventListener('scroll', positionToolbar, true);

  document.addEventListener('keydown', function(e){
    if (!screens.builder.classList.contains('active')) return;
    if (!state.selectedUid) return;
    if (e.key === 'Delete' || e.key === 'Backspace'){
      e.preventDefault();
      itemToolbar.querySelector('[data-action="delete"]').click();
    }
    if (e.key === 'Escape') deselect();
  });

  /* ---------------- clear room ---------------- */
  var confirmingClear = false, confirmTimer = null;
  clearBtn.addEventListener('click', function(){
    if (!confirmingClear){
      confirmingClear = true;
      clearBtn.textContent = 'Click again to confirm';
      confirmTimer = setTimeout(function(){
        confirmingClear = false;
        clearBtn.textContent = 'Clear room';
      }, 3000);
      return;
    }
    clearTimeout(confirmTimer);
    confirmingClear = false;
    clearBtn.textContent = 'Clear room';
    state.placed = [];
    state.selectedUid = null;
    fullRerenderPieces();
    itemToolbar.classList.remove('visible');
  });

  /* ---------------- scoring: variety & balance ---------------- */
  function computeScore(){
    var placed = state.placed;
    var n = placed.length;
    if (n === 0) return null;

    var categoriesUsed = {}, assetsUsed = {}, sumWidth = 0;
    var zones = [false,false,false];
    placed.forEach(function(p){
      var asset = getAsset(p.assetId);
      categoriesUsed[asset.category] = true;
      assetsUsed[p.assetId] = true;
      sumWidth += p.width;
      var zoneIdx = p.x < 33.34 ? 0 : (p.x < 66.67 ? 1 : 2);
      zones[zoneIdx] = true;
    });

    var categoryScore = Math.round(Object.keys(categoriesUsed).length / CATEGORIES.length * 100);
    var varietyScore = Math.round(Object.keys(assetsUsed).length / Math.min(n, ITEMS.length) * 100);
    var coverageScore = clamp(100 - Math.abs(sumWidth - 55) * 2, 0, 100);
    var zonesUsed = zones.filter(Boolean).length;
    var spreadScore = n <= 1 ? 100 : Math.round(zonesUsed / 3 * 100);
    var spaceScore = Math.round(coverageScore * 0.6 + spreadScore * 0.4);
    var overall = Math.round((categoryScore + varietyScore + spaceScore) / 3);

    return { overall:overall, categoryScore:categoryScore, varietyScore:varietyScore, spaceScore:spaceScore };
  }

  function titleForScore(s){
    if (s >= 90) return 'A Roomstory Worth Telling';
    if (s >= 75) return 'Beautifully Balanced';
    if (s >= 50) return 'Well-Loved Room';
    if (s >= 25) return 'Getting Cozy';
    return 'Just Moved In';
  }

  finishBtn.addEventListener('click', function(){
    var result = computeScore();
    if (!result){
      finishBtn.classList.add('nudge');
      setTimeout(function(){ finishBtn.classList.remove('nudge'); }, 450);
      return;
    }
    document.getElementById('resultsTitle').textContent = titleForScore(result.overall);
    document.getElementById('resultsScore').innerHTML = result.overall + '<span>/100</span>';
    var rows = [
      { label:'Category mix', value:result.categoryScore },
      { label:'Fresh picks', value:result.varietyScore },
      { label:'Room balance', value:result.spaceScore }
    ];
    resultsBars.innerHTML = rows.map(function(r){
      return '<div class="result-bar-row"><div class="label-row"><span>'+r.label+'</span><span>'+r.value+'</span></div>' +
             '<div class="result-bar-track"><div class="result-bar-fill" style="width:'+r.value+'%"></div></div></div>';
    }).join('');
    resultsOverlay.classList.add('active');
  });

  document.getElementById('resultsClose').addEventListener('click', function(){ resultsOverlay.classList.remove('active'); });
  document.getElementById('resultsKeepBtn').addEventListener('click', function(){ resultsOverlay.classList.remove('active'); });
  document.getElementById('resultsChangeRoomBtn').addEventListener('click', function(){
    resultsOverlay.classList.remove('active');
    renderRoomGrid();
    showScreen('picker');
  });

  /* ---------------- ambient dust motes ---------------- */
  function createDustMotes(){
    var count = 13;
    for (var i=0;i<count;i++){
      var mote = document.createElement('div');
      mote.className = 'dust-mote';
      var size = 2 + Math.random()*3.5;
      mote.style.width = size+'px';
      mote.style.height = size+'px';
      mote.style.left = (Math.random()*100)+'%';
      mote.style.top = (30+Math.random()*65)+'%';
      mote.style.setProperty('--drift-x', (Math.random()*40-20).toFixed(0)+'px');
      mote.style.setProperty('--drift-y', (-(90+Math.random()*110)).toFixed(0)+'px');
      var duration = 14 + Math.random()*14;
      mote.style.animationDuration = duration.toFixed(1)+'s';
      mote.style.animationDelay = (Math.random()*-duration).toFixed(1)+'s';
      stage.appendChild(mote);
    }
  }

  /* ---------------- init ---------------- */
  document.querySelector('.title-bg').style.backgroundImage = "url('"+BACKGROUNDS[0].src+"')";
  renderRoomGrid();
  refreshRoomVisuals();
  renderTimeControls();
  renderTabs();
  renderTray();
  updateHint();
  setTrayOpen(state.trayOpen);
  createDustMotes();

})();
</script>
</body>
</html>
